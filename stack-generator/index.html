<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bands — gerador de faixas</title>
<style>
  :root{
    --panel:#111314;
    --line:#26292b;
    --txt:#e7e9ea;
    --dim:#8b9296;
    --accent:#e879f9;
    --radius:2px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#0c0d0e;color:var(--txt);
    font:14px/1.4 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;overflow:hidden;
  }
  /* ---------- painel ---------- */
  aside{
    width:312px;flex:0 0 312px;height:100%;overflow-y:auto;
    background:var(--panel);border-right:1px solid var(--line);
    padding:22px 20px 40px;
  }
  aside::-webkit-scrollbar{width:8px}
  aside::-webkit-scrollbar-thumb{background:#2f3436;border-radius:4px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin:0;font-weight:700}
  .tag{color:var(--dim);font-size:11px;letter-spacing:.06em;margin:0 0 22px}
  fieldset{border:0;padding:0;margin:0 0 20px}
  legend,.grouplabel{
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
    padding:0 0 10px;display:block;width:100%;border-bottom:1px solid var(--line);margin-bottom:12px;
  }
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .row label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .row.off{opacity:.3;pointer-events:none}
  input[type=range].off{opacity:.3;pointer-events:none}
  .row output{font-variant-numeric:tabular-nums;font-size:11px;color:var(--txt);min-width:46px;text-align:right}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:2px;background:#33383b;margin:6px 0 14px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--txt);cursor:pointer;border:0;
  }
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--txt);cursor:pointer}
  select,input[type=text]{
    width:100%;background:#1a1d1f;color:var(--txt);border:1px solid var(--line);
    border-radius:var(--radius);padding:8px 9px;font:inherit;font-size:12px;
  }
  select:focus,input:focus{outline:1px solid var(--accent);outline-offset:0}
  .seed{display:flex;gap:8px}
  .seed input{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
  .seed button{flex:0 0 40px}
  button{
    background:#1a1d1f;color:var(--txt);border:1px solid var(--line);border-radius:var(--radius);
    padding:9px 10px;font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  }
  button:hover{border-color:#4a5052;background:#222628}
  button[aria-pressed=true]{background:#2c3033;border-color:#4a5052}
  button.primary{background:var(--accent);border-color:var(--accent);color:#2b0b2f;font-weight:700}
  button.primary:hover{filter:brightness(1.08)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
  .quad.off{opacity:.3;pointer-events:none}
  .quad button{letter-spacing:.06em}
  .swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sw{border:1px solid var(--line);border-radius:var(--radius);padding:6px;cursor:pointer;background:#1a1d1f}
  .sw[aria-pressed=true]{border-color:var(--accent)}
  .sw .chips{display:flex;height:16px;overflow:hidden;border-radius:1px}
  .sw .chips i{flex:1}
  .sw em{display:block;font-style:normal;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:5px}
  .field{margin-bottom:9px}
  .field span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
  .hint{font-size:10px;line-height:1.7;color:#666d70;letter-spacing:.04em;margin-top:18px}
  .hint kbd{background:#1a1d1f;border:1px solid var(--line);border-radius:2px;padding:1px 4px;font-size:9px}
  /* ---------- palco ---------- */
  main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:14px}
  .stage{position:relative;max-width:100%;box-shadow:0 24px 70px rgba(0,0,0,.55)}
  canvas{display:block;max-width:100%;cursor:crosshair}
  .meta{
    display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
    font:11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--dim);letter-spacing:.08em;text-transform:uppercase;
  }
  .meta b{color:var(--txt);font-weight:400}
  @media (max-width:820px){
    body{flex-direction:column;overflow:auto}
    aside{width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    main{padding:20px}
  }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <path d="M0 0h9a11 11 0 010 22H0z" fill="#e879f9"/>
      <path d="M11 1a10 10 0 010 20z" fill="#e879f9"/>
    </svg>
    <h1>Bands</h1>
  </div>
  <p class="tag">Formas chapadas: variantes de uma elipse, código de barras ou compassos.</p>

  <fieldset>
    <span class="grouplabel">Layout</span>
    <div class="btns" id="layouts"></div>
  </fieldset>

  <fieldset>
    <legend>Composição</legend>
    <div class="row" id="r_count"><label for="count" id="countLabel">Arcos</label><output id="countOut"></output></div>
    <input type="range" id="count" min="2" max="24" step="1">
    <div class="row" id="r_radius"><label for="radius" id="radiusLabel">Raio</label><output id="radiusOut"></output></div>
    <input type="range" id="radius" min="20" max="300" step="1">
    <div class="row" id="r_decay"><label for="decay" id="decayLabel">Decaimento</label><output id="decayOut"></output></div>
    <input type="range" id="decay" min="50" max="130" step="1">
    <div class="row" id="r_step"><label for="step" id="stepLabel">Passo</label><output id="stepOut"></output></div>
    <input type="range" id="step" min="-20" max="60" step="1">
    <div class="row" id="r_start"><label for="start" id="startLabel">Início</label><output id="startOut"></output></div>
    <input type="range" id="start" min="-40" max="130" step="1">
    <div class="row" id="r_angle"><label for="angle" id="angleLabel">Ângulo</label><output id="angleOut"></output></div>
    <input type="range" id="angle" min="-180" max="180" step="1">
    <div class="row" id="r_dir"><label>Direção</label></div>
    <div class="quad" id="dirs"></div>
    <div class="row" id="r_origin"><label for="origin" id="originLabel">Origem</label><output id="originOut"></output></div>
    <input type="range" id="origin" min="0" max="100" step="1">
    <div class="row"><label for="format">Formato</label></div>
    <select id="format">
      <option value="wide">Wide 16:9</option>
      <option value="square">Quadrado 1:1</option>
      <option value="tall">Vertical 9:16</option>
      <option value="post">Post 4:5</option>
      <option value="banner">Banner 3:1</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>Movimento</legend>
    <div class="row"><label for="mode">Animação</label></div>
    <select id="mode">
      <option value="slide">Deslizar — a fila vai e volta</option>
      <option value="accordion">Sanfona — o passo abre e fecha</option>
      <option value="pulse">Pulsar — o raio respira</option>
      <option value="spin">Girar — a direção roda</option>
      <option value="off">Estático</option>
    </select>
    <div class="row" id="r_amount" style="margin-top:12px"><label for="amount">Intensidade</label><output id="amountOut"></output></div>
    <input type="range" id="amount" min="0" max="100" step="1">
    <div class="row"><label for="speed">Ritmo</label><output id="speedOut"></output></div>
    <input type="range" id="speed" min="1" max="80" step="1">
  </fieldset>

  <fieldset>
    <span class="grouplabel">Cores</span>
    <div class="swatches" id="palettes"></div>
    <div class="btns" style="margin-top:9px">
      <button id="bTwo" aria-pressed="true">Duas cores</button>
      <button id="bMulti" aria-pressed="false">Paleta</button>
    </div>
  </fieldset>

  <fieldset>
    <span class="grouplabel">Semente</span>
    <div class="seed">
      <input type="text" id="seed" spellcheck="false" autocomplete="off">
      <button id="dice" title="Nova semente">&#8635;</button>
    </div>
  </fieldset>

  <fieldset>
    <span class="grouplabel">Exportar</span>
    <div class="btns">
      <button id="freeze">Congelar</button>
      <button id="regen" class="primary">Gerar</button>
      <button id="png1">PNG 1&times;</button>
      <button id="png2">PNG 2&times;</button>
      <button id="svg">SVG</button>
      <button id="link">Copiar link</button>
    </div>
  </fieldset>

  <p class="hint">
    <kbd>espaço</kbd> gerar &middot; <kbd>F</kbd> congelar &middot; <kbd>E</kbd> exportar PNG<br>
    <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> troca de layout &middot; clique na arte move o primeiro corte.
  </p>
</aside>

<main>
  <div class="stage"><canvas id="c"></canvas></div>
  <div class="meta">
    <span>semente <b id="mSeed">—</b></span>
    <span>arcos <b id="mArcs">—</b></span>
    <span>raio <b id="mR">—</b></span>
  </div>
</main>

<script>
/* ------------------------------------------------------------------ *
 *  Bands — faixas de cor chapada delimitadas por uma fila de fronteiras.
 *
 *
 *  Arc Bands — ha uma elipse principal, e cada peca e ela mesma cortada por
 *  uma corda cada vez mais baixa: a primeira e a elipse inteira, as seguintes
 *  sao calotas cada vez mais rasas. As pecas sao empilhadas pela propria
 *  altura, entao a pilha nunca se sobrepoe.
 *
 *  Barcode — a fronteira é um CORTE RETO. Cada célula tem um peso e uma
 *  proporção de tinta que cai geometricamente ao longo da fila: densa de
 *  um lado, rarefeita do outro. Os pesos são normalizados no fim, então a
 *  fila preenche o quadro exato em qualquer contagem.
 * ------------------------------------------------------------------ */

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const newSeed = () => Math.random().toString(36).slice(2, 8).toUpperCase();

/* ---------- paletas: bg = fundo, ink = acento ---------- */
const PALETTES = {
  bloom:     { name:'Bloom',     bg:'#3d3d3d', ink:'#e879f9',
               bands:['#e879f9','#3d3d3d','#f9a8f5','#4a4a4a','#c98cff','#333333'] },
  stack:     { name:'Stack',     bg:'#f2f2f0', ink:'#f48024',
               bands:['#f48024','#f2f2f0','#0c0d0e','#c9ccce','#ffb066','#e6e3db'] },
  ink:       { name:'Ink',       bg:'#0c0d0e', ink:'#f2f2f0',
               bands:['#f2f2f0','#0c0d0e','#9aa0a3','#1c1d1e','#d8d8d3','#2b2c2d'] },
  ember:     { name:'Ember',     bg:'#1b0f04', ink:'#ffc300',
               bands:['#ffc300','#1b0f04','#ff5a1f','#3a1c06','#ffb066','#2a1405'] },
  blueprint: { name:'Blueprint', bg:'#0a2540', ink:'#7de2ff',
               bands:['#7de2ff','#0a2540','#4361ff','#134a78','#c3b9ff','#0e3358'] },
  paper:     { name:'Paper',     bg:'#e6e2d6', ink:'#c8492b',
               bands:['#c8492b','#e6e2d6','#1f1c17','#a89b7d','#4f6b52','#d8d2c2'] },
  noir:      { name:'Noir',      bg:'#f4f4f2', ink:'#141414',
               bands:['#141414','#f4f4f2','#3d3d3d','#d8d8d3','#6b6b64','#ffffff'] },
  volt:      { name:'Volt',      bg:'#0d0d0d', ink:'#ccff00',
               bands:['#ccff00','#0d0d0d','#a3cc00','#1c1c1c','#e8ff7a','#2b2b2b'] }
};

/* ---------- formatos ---------- */
const FORMATS = {
  wide:   { a: 16 / 9, w: 1920 },
  square: { a: 1,      w: 1600 },
  tall:   { a: 9 / 16, w: 1080 },
  post:   { a: 4 / 5,  w: 1440 },
  banner: { a: 3,      w: 2400 }
};

/* ---------- layouts ---------- *
 * Os dois sistemas partem da mesma ideia: uma fila de fronteiras que divide
 * o quadro em faixas de cor chapada. No Arc Bands a fronteira e um arco; no
 * Barcode e um corte reto, e o que varia e a proporcao tinta/papel.
 * Cada layout renomeia e re-escala os controles que compartilha.        */
const LAYOUTS = {
  arcs: {
    name: 'Arc Bands',
    labels: { count:'Peças', radius:'Raio', decay:'Progressão', step:'Abertura',
              start:'Achatamento', angle:'Ângulo', origin:'Variação' },
    ranges: { count:[2,14], radius:[20,140], decay:[40,160], step:[0,60],
              start:[20,200], origin:[0,100] },
    uses: ['count','radius','decay','step','start','angle','origin'],
    modes: ['slide','accordion','pulse','spin','off']
  },
  cadence: {
    name: 'Cadence',
    labels: { count:'Linhas', step:'Blocos', radius:'Espessura', decay:'Progressão',
              start:'Ritmo', origin:'Variação' },
    ranges: { count:[2,14], step:[2,40], radius:[10,90], decay:[40,140],
              start:[0,100], origin:[0,100] },
    uses: ['count','step','radius','decay','start','origin','dir'],
    modes: ['run','pulse','off']
  },
  bars: {
    name: 'Barcode',
    labels: { count:'Barras', radius:'Tinta', decay:'Progressão', origin:'Variação' },
    ranges: { count:[3,48], radius:[5,95], decay:[40,140], origin:[0,100] },
    uses: ['count','radius','decay','origin','dir'],
    modes: ['fall','march','pulse','accordion','off']
  }
};

/* direções discretas do Barcode: a fila anda no +x do referencial girado,
   então o giro define para onde ela caminha */
const DIRS = { right: 0, down: 90, left: 180, up: 270 };
const DIR_LABELS = { left: '←  esquerda', right: '→  direita', up: '↑  cima', down: '↓  baixo' };

const MODE_LABELS = {
  run:       'Correr — cada linha no seu tempo',
  fall:      'Caindo — as barras se soltam do apoio',
  march:     'Andar — a fila atravessa a tela',
  slide:     'Deslizar — a fila vai e volta',
  accordion: 'Sanfona — os pesos abrem e fecham',
  pulse:     'Pulsar — respira',
  spin:      'Girar — a direção roda',
  off:       'Estático'
};

/* ---------- estado ---------- */
const S = {
  layout: 'arcs',
  count: 6, radius: 118, decay: 96, step: 12, start: 58, angle: 0, dir: 'left', origin: 50,
  format: 'wide', mode: 'slide', amount: 45, speed: 20,
  palette: 'bloom', multi: false,
  seed: newSeed(), frozen: false, phase: 0
};

const uses = k => LAYOUTS[S.layout].uses.includes(k);
const spinAngle = () => S.layout === 'bars' ? DIRS[S.dir] : S.angle;

const pal = () => PALETTES[S.palette];

/* jitter por semente: quebra a regularidade da fila sem sair do sistema */
function jitters(){
  const rng = mulberry32(hashStr(S.seed));
  // 64 entradas: tem de cobrir a maior contagem de qualquer layout (Barras
  // chega a 48), porque o modo Caindo indexa por i % n para manter o período
  // do padrão igual a n — e com isso o loop fecha.
  return Array.from({ length: 64 }, () => ({ r: .9 + rng() * .2, o: (rng() - .5) * .7 }));
}
let JIT = jitters();

/* ---------- geometria: variantes de uma elipse ---------- *
 * Ha uma elipse principal. Cada peca e ela mesma, cortada por uma corda
 * horizontal cada vez mais baixa: a primeira e a elipse inteira, e as
 * seguintes sao calotas cada vez mais rasas. As pecas sao empilhadas pela
 * propria altura, entao a pilha nunca se sobrepoe, qualquer que seja a
 * progressao.
 * `c` e a altura da corda no eixo menor, de -1 (elipse inteira) a +1 (nada). */
function arcList(W, H){
  const n = S.count, J = JIT, p = S.phase;
  const amt = S.amount / 100;
  const base = Math.min(W, H);

  const pulse     = S.mode === 'pulse'     ? 1 + .18 * amt * Math.sin(p) : 1;
  const accordion = S.mode === 'accordion' ? 1 + 1.4 * amt * Math.sin(p) : 1;
  const slide     = S.mode === 'slide'     ? .55 * amt * Math.sin(p) : 0;

  const a = S.radius / 100 * base * .5 * pulse;          // semieixo maior
  const b = a * (S.start / 100);                         // achatamento
  const prog = S.decay / 100;
  const gap = S.step / 100 * base * .12 * accordion;
  const vary = S.origin / 100;

  // corda de cada peca: comeca na elipse inteira e sobe conforme a progressao
  const pecas = [];
  let alturaTotal = 0;
  for (let k = 0; k < n; k++){
    const j = J[k % J.length];
    const t = n === 1 ? 0 : k / (n - 1);
    let c = -1 + 2 * Math.pow(t, prog) + slide + j.o * vary * .3;
    c = clamp(c, -1, .985);
    const alt = b * (1 - c);                             // altura da calota
    pecas.push({ c, alt, fill: S.multi ? pal().bands[k % pal().bands.length] : pal().ink });
    alturaTotal += alt;
  }
  alturaTotal += gap * (n - 1);

  let y = -alturaTotal / 2;
  for (const pc of pecas){
    pc.a = a;
    pc.b = b;
    pc.cy = y + pc.alt - b;                              // centro da elipse da peca
    y += pc.alt + gap;
  }
  return pecas;
}

/* ---------- geometria: as barras ---------- *
 * Cada celula tem um peso e uma proporcao de tinta. A proporcao cai de forma
 * geometrica ao longo da fila: densa de um lado, rarefeita do outro. Os pesos
 * sao normalizados no fim, entao a fila sempre preenche o quadro por inteiro,
 * qualquer que seja a contagem ou o jitter.                              */
function barList(W, H){
  const n = S.count, J = JIT;
  const amt = S.amount / 100, p = S.phase;
  const duty0 = clamp(S.radius / 100, .02, .98);
  const fall = S.decay / 100;
  const vary = S.origin / 100;
  // As direções do Barcode são axiais, então o vão da fila é exatamente a
  // dimensão do quadro naquela direção — não a diagonal. É o que garante que
  // a barra de apoio caia dentro do quadro e que `Barras` signifique de fato
  // o número de barras atravessando a tela.
  const L = (S.dir === 'up' || S.dir === 'down') ? H : W;
  const cor = i => S.multi ? pal().bands[(i % n) % pal().bands.length] : pal().ink;

  if (S.mode === 'fall'){
    // A barra de apoio nao sai do lugar; as outras se soltam dela e afinam.
    // A diferenca em relacao a marcha e de onde vem a largura: aqui ela e
    // funcao da DISTANCIA ate o apoio, nao da barra. Entao a barra afina
    // enquanto se afasta, e nao carrega a propria espessura.
    // Em frac = 1 cada barra assume o lugar (e a espessura) da anterior:
    // a imagem se repete e o loop fecha.
    const frac = (p / TAU) % 1;
    const base = L / n;                               // passo constante: queda uniforme
    const jit = u => {                                // jitter interpolado: continuo
      const i = Math.floor(u), t = u - i;
      const a = J[i % n].r - 1, b = J[(i + 1) % n].r - 1;
      return 1 + (a * (1 - t) + b * t) * vary * 1.6;
    };
    const bar = u => {
      const duty = clamp(duty0 * Math.pow(fall, u) * jit(u), .01, .99);
      // piso de meio pixel: com contagem alta e progressão forte a cauda
      // ficaria sub-pixel e o quadro pareceria vazio
      return { x: -L / 2 + base * u, w: Math.max(base * duty, .6), fill: cor(Math.round(u)) };
    };
    const out = [bar(0)];                             // o apoio
    for (let i = 0; i < n; i++) out.push(bar(i + frac));
    return out;
  }

  const pulse = S.mode === 'pulse'     ? 1 + .5 * amt * Math.sin(p) : 1;
  const acc   = S.mode === 'accordion' ? amt : 0;

  // Padrão PERIÓDICO de n células. Como o índice absoluto entra por k % n,
  // rolar exatamente um período devolve a mesma imagem: a marcha fecha em
  // loop. Com Progressão em 100% não existe degrau entre um período e o
  // seguinte, e a fila anda sem costura nenhuma.
  const cells = [];
  let period = 0;
  for (let i = 0; i < n; i++){
    const j = J[i % J.length];
    const duty = clamp(duty0 * pulse * Math.pow(fall, i), .02, .98);
    const w = Math.max(.08, 1 + (j.r - 1) * vary * 4 + acc * .6 * Math.sin(p + i * .8));
    cells.push({ w, duty });
    period += w;
  }

  const scale = L / period;            // um período preenche a diagonal
  const periodPx = period * scale;
  const march = S.mode === 'march' ? (p / TAU * periodPx) % periodPx : 0;

  const out = [];
  let x = -L / 2 - periodPx + march;   // começa um período atrás da borda
  let k = 0;
  while (x < L / 2){
    const c = cells[k % n];
    const w = c.w * scale;
    if (x + w > -L / 2) out.push({ x, w: Math.max(w * c.duty, .6), fill: cor(k) });
    x += w;
    k++;
  }
  return out;
}

/* ---------- geometria: as linhas do Cadence ---------- *
 * Cada linha e um compasso proprio: sua propria contagem de blocos e sua
 * propria velocidade. Como o padrao de uma linha se repete a cada celula, e
 * cada linha avanca um numero INTEIRO de celulas por ciclo, todas voltam ao
 * lugar ao mesmo tempo — o loop fecha por construcao, mesmo com as linhas
 * andando em velocidades diferentes.                                     */
function cadenceList(W, H){
  const rows = S.count, J = JIT, p = S.phase;
  const blocks0 = S.step;
  const duty = clamp(S.radius / 100, .05, .95);
  const prog = S.decay / 100;
  const spread = S.start / 100;
  const vary = S.origin / 100;
  const amt = S.amount / 100;

  const vertical = S.dir === 'up' || S.dir === 'down';
  const along = vertical ? H : W;      // eixo em que a linha corre
  const across = vertical ? W : H;     // eixo em que as linhas se empilham
  const sign = (S.dir === 'left' || S.dir === 'up') ? -1 : 1;
  const pulse = S.mode === 'pulse' ? 1 + .45 * amt * Math.sin(p) : 1;

  const out = [];
  for (let r = 0; r < rows; r++){
    const j = J[r % J.length];
    const nb = Math.max(1, Math.round(blocks0 * Math.pow(prog, r) * (1 + (j.r - 1) * vary * 3)));
    const cell = along / nb;
    const w = clamp(duty * pulse * (1 + (j.o) * vary), .05, .95) * cell;
    const m = 1 + Math.round(spread * 6 * r);            // voltas inteiras por ciclo
    const off = S.mode === 'run' ? (sign * (p / TAU) * m * cell) % cell : 0;
    const y0 = -across / 2 + across * r / rows;
    const y1 = -across / 2 + across * (r + 1) / rows;
    const fill = S.multi ? pal().bands[r % pal().bands.length] : pal().ink;
    for (let i = -1; i <= nb; i++)
      out.push({ x: -along / 2 + i * cell + off, w, y0, y1, fill });
  }
  return out;
}

/* Registro das geometrias. Serve de trava: se uma funcao sumir num refactor,
   o arquivo quebra aqui no carregamento, com o nome do layout, em vez de
   deixar um layout silenciosamente vazio na tela. */
const GEOM = { arcs: arcList, bars: barList, cadence: cadenceList };
Object.keys(LAYOUTS).forEach(k => {
  if (typeof GEOM[k] !== 'function') throw new Error('layout sem geometria: ' + k);
});

/* ---------- desenho ---------- */
function drawScene(ctx, W, H){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = pal().bg;
  ctx.fillRect(0, 0, W, H);
  const M = Math.hypot(W, H) * 2;
  // Cadence e Barcode sao axiais, entao as bordas podem cair em pixel inteiro.
  // Sem isso a cobertura parcial mistura tinta e fundo e deixa um fio claro na
  // divisa — o que parece um stroke, mas e antialiasing.
  //
  // A LARGURA da barra e arredondada sozinha, e nao como round(x+w)-round(x):
  // essa diferenca depende da parte fracionaria de x, entao a barra mudava de
  // espessura sozinha enquanto a fila rastejava — a linha inteira piscava.
  // Barras vizinhas nao se encostam (ha papel entre elas), entao arredondar a
  // largura nao abre fresta. Ja as LINHAS do Cadence se encostam, e por isso
  // as bordas horizontais continuam arredondadas aos pares.
  const axial = S.layout === 'cadence' || S.layout === 'bars';
  const R = v => Math.round(v);
  const Rw = v => Math.max(1, Math.round(v));
  ctx.save();
  ctx.translate(axial ? R(W / 2) : W / 2, axial ? R(H / 2) : H / 2);
  ctx.rotate(spinAngle() * DEG);
  if (S.layout === 'cadence'){
    for (const b of cadenceList(W, H)){
      ctx.fillStyle = b.fill;
      ctx.fillRect(R(b.x), R(b.y0), Rw(b.w), Math.max(1, R(b.y1) - R(b.y0)));
    }
  } else if (S.layout === 'bars'){
    for (const b of barList(W, H)){
      ctx.fillStyle = b.fill;
      ctx.fillRect(R(b.x), -M / 2, Rw(b.w), M);
    }
  } else {
    // calota: percorre o arco de baixo, de uma ponta da corda a outra, e fecha
    for (const pc of arcList(W, H)){
      const t0 = Math.asin(clamp(pc.c, -1, 1));
      ctx.beginPath();
      ctx.ellipse(0, pc.cy, pc.a, pc.b, 0, t0, Math.PI - t0, false);
      ctx.closePath();
      ctx.fillStyle = pc.fill;
      ctx.fill();
    }
  }
  ctx.restore();
}

/* ---------- loop ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let last = 0;

function resize(){
  const A = FORMATS[S.format].a;
  const main = document.querySelector('main');
  const availW = Math.max(240, (main.clientWidth || 800) - 64);
  const availH = Math.max(220, window.innerHeight - (window.innerWidth > 820 ? 130 : 220));
  let w = availW, h = w / A;
  if (h > availH){ h = availH; w = h * A; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
}

function frame(now){
  // agenda antes de desenhar: uma exceção no meio do quadro não pode deixar
  // o gerador congelado para sempre
  requestAnimationFrame(frame);
  const dt = last ? Math.min(now - last, 120) : 16;
  last = now;
  try {
  if (!S.frozen && S.mode !== 'off'){
    S.phase += dt / 1000 * (S.speed / 100) * 1.6;
    if (S.mode === 'spin' && S.layout !== 'bars')
      S.angle = ((S.angle + dt / 1000 * (S.speed / 100) * 24 + 180) % 360) - 180;
  }
  drawScene(ctx, canvas.width, canvas.height);
  } catch (e){
    console.error('quadro falhou:', e);
  }
}

/* ---------- exportação ---------- */
function download(url, name, revoke){
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  if (revoke) setTimeout(() => URL.revokeObjectURL(url), 6000);
}
function expDims(scale){
  const f = FORMATS[S.format];
  const W = Math.round(f.w * scale);
  return { W, H: Math.round(W / f.a) };
}
function exportPNG(scale){
  const { W, H } = expDims(scale);
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  drawScene(off.getContext('2d'), W, H);
  download(off.toDataURL('image/png'), 'arcs-' + S.seed + '-' + S.format + '@' + scale + 'x.png');
}
function exportSVG(){
  const { W, H } = expDims(1);
  const n = v => Math.round(v * 100) / 100;
  const M = Math.round(Math.hypot(W, H) * 2);
  const out = [
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">',
    '<rect width="' + W + '" height="' + H + '" fill="' + pal().bg + '"/>',
    '<g transform="translate(' + n(W / 2) + ' ' + n(H / 2) + ') rotate(' + spinAngle() + ')">'
  ];
  // mesma primitiva e mesma ordem de pintura do canvas
  const R = v => Math.round(v);
  const Rw = v => Math.max(1, Math.round(v));
  if (S.layout === 'cadence'){
    for (const b of cadenceList(W, H))
      out.push('<rect x="' + R(b.x) + '" y="' + R(b.y0) + '" width="' + Rw(b.w) +
               '" height="' + Math.max(1, R(b.y1) - R(b.y0)) + '" fill="' + b.fill + '"/>');
  } else if (S.layout === 'bars'){
    for (const b of barList(W, H))
      out.push('<rect x="' + R(b.x) + '" y="' + n(-M / 2) + '" width="' + Rw(b.w) +
               '" height="' + M + '" fill="' + b.fill + '"/>');
  } else {
    for (const pc of arcList(W, H)){
      const t0 = Math.asin(clamp(pc.c, -1, 1));
      if (pc.c <= -0.999){
        out.push('<ellipse cx="0" cy="' + n(pc.cy) + '" rx="' + n(pc.a) + '" ry="' + n(pc.b) + '" fill="' + pc.fill + '"/>');
        continue;
      }
      const x0 = n(pc.a * Math.cos(t0)), y0 = n(pc.cy + pc.b * Math.sin(t0));
      const grande = Math.PI - 2 * t0 > Math.PI ? 1 : 0;
      out.push('<path d="M' + x0 + ' ' + y0 + 'A' + n(pc.a) + ' ' + n(pc.b) + ' 0 ' + grande + ' 1 ' +
               n(-pc.a * Math.cos(t0)) + ' ' + y0 + 'Z" fill="' + pc.fill + '"/>');
    }
  }
  out.push('</g>');
  out.push('</svg>');
  const url = URL.createObjectURL(new Blob([out.join('\n')], { type: 'image/svg+xml' }));
  download(url, 'arcs-' + S.seed + '-' + S.format + '.svg', true);
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const NUM = ['count', 'radius', 'decay', 'step', 'start', 'angle', 'origin', 'amount', 'speed'];
const SUFFIX = { radius:'%', decay:'%', step:'%', start:'%', angle:'°', origin:'%', amount:'%' };

function syncMeta(){
  $('mSeed').textContent = S.seed;
  $('mArcs').textContent = S.count;
  $('mR').textContent = S.radius + '%';
  NUM.forEach(k => $(k + 'Out').textContent =
    k === 'speed' ? (S.speed / 100).toFixed(2) : S[k] + (SUFFIX[k] || ''));
}
const OPTIONAL = ['count','radius','decay','step','start','angle','origin'];

function syncLayout(){
  const L = LAYOUTS[S.layout];
  OPTIONAL.forEach(k => {
    // o slider é irmão da linha do rótulo, não filho: os dois precisam do mesmo estado
    $('r_' + k).classList.toggle('off', !uses(k));
    $(k).classList.toggle('off', !uses(k));
    if (L.labels[k]) $(k + 'Label').textContent = L.labels[k];
    const rg = L.ranges[k];
    if (rg){ $(k).min = rg[0]; $(k).max = rg[1]; S[k] = clamp(S[k], rg[0], rg[1]); }
  });
  // direção discreta só no Barcode; ângulo contínuo só no Arc Bands
  const dir = uses('dir') ? '' : 'none', ang = uses('angle') ? '' : 'none';
  $('r_dir').style.display = dir;
  $('dirs').style.display = dir;
  $('r_angle').style.display = ang;
  $('angle').style.display = ang;
  document.querySelectorAll('.dir').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.d === S.dir)));
  // só os modos que fazem sentido no layout
  if ($('mode').dataset.layout !== S.layout){
    $('mode').innerHTML = L.modes.map(m =>
      '<option value="' + m + '">' + MODE_LABELS[m] + '</option>').join('');
    $('mode').dataset.layout = S.layout;
  }
  if (!L.modes.includes(S.mode)) S.mode = L.modes[0];
  // Intensidade não faz nada na marcha
  const semAmp = S.mode === 'march' || S.mode === 'fall' || S.mode === 'run';
  $('r_amount').classList.toggle('off', semAmp);
  $('amount').classList.toggle('off', semAmp);
  document.querySelectorAll('.lay').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.k === S.layout)));
}

function syncInputs(){
  syncLayout();
  NUM.forEach(k => $(k).value = S[k]);
  $('format').value = S.format;
  $('mode').value = S.mode;
  $('seed').value = S.seed;
  $('freeze').textContent = S.frozen ? 'Retomar' : 'Congelar';
  $('bTwo').setAttribute('aria-pressed', String(!S.multi));
  $('bMulti').setAttribute('aria-pressed', String(S.multi));
  document.querySelectorAll('.sw').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.pal === S.palette)));
  syncMeta();
}

const HASH_KEYS = ['layout','count','radius','decay','step','start','angle','dir','origin','format','mode','amount','speed',
                   'palette','multi','seed'];
function writeHash(){
  const o = {};
  HASH_KEYS.forEach(k => o[k] = S[k]);
  history.replaceState(null, '', '#' + btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/, ''));
}
function readHash(){
  if (location.hash.length < 2) return;
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
    HASH_KEYS.forEach(k => { if (k in o) S[k] = o[k]; });
  } catch (e){ /* hash inválido: ignora */ }
}

const PRESETS = {
  arcs: { count:6,  radius:96,  decay:130, step:14, start:52, angle:0, origin:20, palette:'noir', mode:'accordion', amount:45 },
  bars: { count:10, radius:95,  decay:68, step:12, start:58, angle:0,  dir:'down', origin:35, palette:'noir', mode:'fall', amount:35 },
  cadence: { count:4, radius:50, decay:62, step:26, start:35, angle:0, dir:'left', origin:25, palette:'volt', mode:'run', amount:40 }
};
function setLayout(k){
  S.layout = k;
  Object.assign(S, PRESETS[k]);
  syncInputs(); writeHash();
}

$('dirs').innerHTML = ['left','right','up','down'].map(d =>
  '<button class="dir" data-d="' + d + '" aria-pressed="false">' + DIR_LABELS[d] + '</button>').join('');
document.querySelectorAll('.dir').forEach(b => b.addEventListener('click', () => {
  S.dir = b.dataset.d; syncInputs(); writeHash();
}));

$('layouts').innerHTML = Object.entries(LAYOUTS).map(([k, l]) =>
  '<button class="lay" data-k="' + k + '" aria-pressed="false">' + l.name + '</button>').join('');
document.querySelectorAll('.lay').forEach(b =>
  b.addEventListener('click', () => setLayout(b.dataset.k)));

$('palettes').innerHTML = Object.entries(PALETTES).map(([k, p]) =>
  '<button class="sw" data-pal="' + k + '" aria-pressed="false">' +
    '<span class="chips">' + [p.ink, p.bg, p.bands[2], p.bands[4]].map(c => '<i style="background:' + c + '"></i>').join('') + '</span>' +
    '<em>' + p.name + '</em>' +
  '</button>').join('');
document.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => {
  S.palette = b.dataset.pal; syncInputs(); writeHash();
}));

NUM.forEach(k => $(k).addEventListener('input', e => { S[k] = +e.target.value; syncMeta(); writeHash(); }));
$('format').addEventListener('change', e => { S.format = e.target.value; resize(); writeHash(); });
$('mode').addEventListener('change', e => { S.mode = e.target.value; writeHash(); });

function regenerate(){
  S.seed = newSeed();
  JIT = jitters();
  syncInputs(); writeHash();
}
$('seed').addEventListener('change', e => {
  S.seed = e.target.value.trim().toUpperCase() || newSeed();
  JIT = jitters(); syncInputs(); writeHash();
});
$('dice').addEventListener('click', regenerate);
$('regen').addEventListener('click', regenerate);
$('freeze').addEventListener('click', () => { S.frozen = !S.frozen; syncInputs(); });
$('bTwo').addEventListener('click', () => { S.multi = false; syncInputs(); writeHash(); });
$('bMulti').addEventListener('click', () => { S.multi = true; syncInputs(); writeHash(); });
$('png1').addEventListener('click', () => exportPNG(1));
$('png2').addEventListener('click', () => exportPNG(2));
$('svg').addEventListener('click', exportSVG);
$('link').addEventListener('click', async e => {
  writeHash();
  const btn = e.currentTarget;
  try { await navigator.clipboard.writeText(location.href); btn.textContent = 'Copiado'; }
  catch { btn.textContent = 'Use a URL'; }
  setTimeout(() => btn.textContent = 'Copiar link', 1400);
});

// clique põe o primeiro corte onde o cursor está
canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  S.start = Math.round(clamp(x * 100, -40, 130));
  syncInputs(); writeHash();
});

document.addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.code === 'Space'){ e.preventDefault(); regenerate(); }
  if (e.key.toLowerCase() === 'f'){ S.frozen = !S.frozen; syncInputs(); }
  if (e.key.toLowerCase() === 'e') exportPNG(2);
  if (/^[123]$/.test(e.key)) setLayout(Object.keys(LAYOUTS)[+e.key - 1]);
});

window.addEventListener('resize', resize);

readHash();
JIT = jitters();
syncInputs();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>

/* mono: base + fundo + direção dos degraus tonais.
   String = atalho para "degraus na direção do próprio fundo" (recuo natural).
   Objeto = fundo e direção explícitos, para casos como preto-sobre-preto,
   em que recuar na direção do fundo apagaria a peça inteira. */
function monoSpec(p){
  const m = p.mono;
  if (typeof m === 'string') return { base:m, bg:p.bg, to:p.bg };
  return { base:m.base, bg:m.bg || p.bg, to:m.to || m.bg || p.bg };
}

/* papéis efetivos: policromático, ou rampa tonal quando mono está ligado */
function roles(i = S.palette){
  const p = PALETTES[i];
  if (!S.mono) return p;
  const m = monoSpec(p);
  const t = f => mix(m.base, m.to, f);
  return { bg:m.bg, top:m.base, a:t(.27), b:t(.5), core:t(.4), end:t(.38),
           bands:[0, .12, .26, .4, .54, .66].map(t) };
}
let RO = PALETTES[0];

/* ---------- layouts ---------- */
const LAYOUTS = {
  pyramid: { name:'Pyramid', label:'Níveis', gapLabel:'Recuo',  min:2, max:16, uses:['count','effector','lobes','height','gap'] },
  twist:   { name:'Twist',   label:'Placas', gapLabel:'Espaço', min:3, max:44, uses:['count','effector','lobes','height','gap'] },
  stack:   { name:'Stack',   label:'Grade',  gapLabel:'Folga',  min:2, max:22, uses:['count','effector','lobes','height','gap'] },
  tower:   { name:'Tower',   label:'Fatias', gapLabel:'Folga',  min:2, max:40, uses:['count','effector','lobes','height','gap'] },
  circle:  { name:'Circle',  label:'Braços', gapLabel:'Folga',  min:6, max:64, uses:['count','segments','effector','lobes','height','inner','gap'] }
};

/* ---------- formatos de export ---------- */
const EXP_ASPECT = { square:1, wide:16/9, tall:9/16, post:4/5 };

/* ---------- estado ---------- */
const S = {
  layout:'pyramid',
  count:6, segments:2, effector:35, lobes:3, height:70, inner:30, gap:14,
  elev:32, zoom:100, panX:0, panY:0, rot:-45 * DEG,
  shadow:0, palette:0, mono:false, bands:false, seed:newSeed(),
  rotate:false, wave:true, speed:20, playing:true, phase:0,
  expFormat:'square', expSize:1080, dur:6, fps:30, cycles:1, frame:0, guide:true
};

const uses = k => LAYOUTS[S.layout].uses.includes(k);
const totalFrames = () => Math.max(1, Math.round(S.dur * S.fps));

/* ---------- geometria ---------- */
function ccw(pts){
  let a = 0;
  for (let i = 0; i < pts.length; i++){
    const j = (i + 1) % pts.length;
    a += pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1];
  }
  return a >= 0 ? pts : pts.slice().reverse();
}
const rect = (x0, y0, x1, y1) => ccw([[x0,y0],[x1,y0],[x1,y1],[x0,y1]]);
function rotPts(pts, a){
  const c = Math.cos(a), s = Math.sin(a);
  return pts.map(([x, y]) => [x * c - y * s, x * s + y * c]);
}

function topColor(seed01){
  const p = RO;
  if (!S.bands) return p.top;
  return p.bands[Math.floor(seed01 * p.bands.length) % p.bands.length];
}

/* peça = { pts, z0, z1, top } */
/* Zigurate: placas maciças, cada uma apoiada no topo da anterior.
   Empilhar (em vez de partir todas do chão) garante que nenhum trecho de
   degrau fique enterrado dentro da placa de baixo — o que pintaria faixas
   escuras sobre o terraço — e que a escada sempre suba.

   Wave aqui GIRA os níveis: o Effector abre a torção estática entre eles
   (o pinwheel) e a fase faz cada nível girar continuamente. O incremento
   é de quartos de volta por ciclo, múltiplo da simetria do quadrado, para
   o WebM continuar fechando em loop perfeito. */
function piecesPyramid(){
  const L = S.count, out = [];
  const step = 1 / L;
  const shrink = step * (.6 + (S.gap / 100) * .8);   // recuo de cada nível
  const riser = (S.height / 100) / L;                // altura de cada degrau
  const twist = S.wave ? (S.effector / 100) * TAU * .18 : 0;
  let z = 0;
  for (let k = 0; k < L; k++){
    const o = 1 - k * shrink;
    if (o <= .03) break;
    const ang = twist * (k / Math.max(1, L - 1)) + (S.wave ? S.phase * .25 * k : 0);
    out.push({
      pts: ccw(rotPts([[-o,-o],[o,-o],[o,o],[-o,o]], ang)),
      z0: z, z1: z + riser,
      top: topColor((k + .5) / L),
      order: z                          // empilhada: a base ordena, e nao anda
    });
    z += riser;
  }
  return out;
}

function piecesTwist(){
  const N = S.count, out = [];
  const thick = (S.height / 100) * 1.7 / N;
  const g = (S.gap / 100) * thick * .7;
  for (let k = 0; k < N; k++){
    const t = k / N;
    const mod = S.wave ? Math.abs(Math.sin(t * Math.PI * S.lobes * .5 + S.phase)) : 1;
    const s = .62 * (.5 + .5 * mod);
    const ang = (S.effector / 100) * t * TAU * .75 + S.phase * .25;
    out.push({
      pts: ccw(rotPts([[-s,-s],[s,-s],[s,s],[-s,s]], ang)),
      z0: k * thick, z1: k * thick + thick - g,
      top: topColor(t),
      order: k * thick                  // empilhada: a base ordena
    });
  }
  return out;
}

function piecesStack(){
  const N = S.count, out = [];
  const cell = 2 / N;
  const g = (S.gap / 100) * cell * .6;
  for (let iy = 0; iy < N; iy++){
    for (let ix = 0; ix < N; ix++){
      const x0 = -1 + ix * cell + g / 2, y0 = -1 + iy * cell + g / 2;
      const cx = x0 + (cell - g) / 2, cy = y0 + (cell - g) / 2;
      const r = Math.hypot(cx, cy) / Math.SQRT2;
      const k = 1 + (S.wave ? S.effector / 100 : 0) * Math.sin(r * Math.PI * S.lobes - S.phase);
      out.push({
        pts: rect(x0, y0, x0 + cell - g, y0 + cell - g),
        z0: 0, z1: Math.max(.02, (S.height / 100) * .55 * k),
        top: topColor(r),
        // apoiada no chao: quem ordena e a profundidade do FOOTPRINT, que o
        // Wave nao mexe. Antes a altura entrava na chave e as colunas
        // embaralhavam a ordem enquanto a onda passava.
        order: raw(cx, cy, 0).d
      });
    }
  }
  return out;
}

/* Tower: fatias iguais empilhadas com folga entre elas. A folga é o que
   revela uma listra do topo da placa de baixo — a listra fina que aparece
   entre as laterais. Effector desloca as placas lateralmente (baralho
   desalinhado); em 0 é uma coluna perfeitamente reta. */
function piecesTower(){
  const N = S.count, out = [];
  const total = (S.height / 100) * 2.6;
  const pitch = total / N;
  const g = (S.gap / 100) * pitch * .6;
  const thick = Math.max(pitch * .12, pitch - g);
  const amp = (S.wave ? S.effector / 100 : 0) * .9;
  for (let k = 0; k < N; k++){
    const t = k / Math.max(1, N - 1);
    const ph = t * Math.PI * S.lobes + S.phase;
    const dx = amp * Math.sin(ph), dy = amp * Math.cos(ph) * .5;
    out.push({
      pts: rect(-1 + dx, -1 + dy, 1 + dx, 1 + dy),
      z0: k * pitch, z1: k * pitch + thick,
      top: topColor(t),
      // empilhada: a fatia de cima sempre por cima. Antes o deslocamento
      // lateral do Wave entrava na chave via `ry` e fatias vizinhas trocavam
      // de ordem no meio da onda. Em Effector muito alto o desalinhamento e
      // grande o bastante para a ordem por z ser discutivel — mas estavel e
      // discutivel le melhor que correta-na-media e piscando.
      order: k * pitch
    });
  }
  return out;
}

function piecesCircle(){
  const N = S.count, out = [];
  const half = (TAU / N) * (1 - S.gap / 100) / 2;
  const r0 = S.inner / 100;
  const low = clamp(1 - S.effector / 100, .06, 1);
  for (let i = 0; i < N; i++){
    const a = i / N * TAU;
    // O Wave modula a ALTURA, não o comprimento: todas as pontas ficam na
    // mesma circunferência e o que muda é a extrusão. Onda triangular — sobe e
    // desce linearmente, do maior ao menor, sem o salto do dente de serra.
    const u = (i / N * S.lobes + S.phase / TAU) % 1;
    const tri = 1 - Math.abs(2 * u - 1);
    const k = S.wave ? low + (1 - low) * tri : 1;
    const r1 = 1.4;
    const armH = Math.max(.03, (S.height / 100) * k);
    const span = r1 - r0;
    for (let j = 0; j < S.segments; j++){
      const ra = r0 + span * (j / S.segments);
      const rb = r0 + span * ((j + 1) / S.segments);
      const P = (r, ang) => [r * Math.cos(ang), r * Math.sin(ang)];
      const rm = (ra + rb) / 2;
      out.push({
        pts: ccw([P(ra, a - half), P(rb, a - half), P(rb, a + half), P(ra, a + half)]),
        z0: 0, z1: armH * (.45 + .55 * (j + 1) / S.segments),
        top: topColor(i / N), roles: ['a', 'end', 'b', 'in'],
        // apoiado no chao: ordena pelo footprint, que o Wave nao mexe — aqui
        // ele modula so a ALTURA do braco
        order: raw(rm * Math.cos(a), rm * Math.sin(a), 0).d
      });
    }
  }
  // Miolo: disco limpo em repouso; deforma junto com o Wave. A altura acompanha
  // o braço mais alto, para esconder as pontas internas das pétalas.
  const cRng = mulberry32(hashStr(S.seed + 'core'));
  const wob = S.wave ? (S.effector / 100) : 0;
  const M = 48, core = [];
  for (let i = 0; i < M; i++){
    const a = i / M * TAU;
    const r = r0 * (1.02 + wob * (.10 * Math.sin(a * 3 + S.phase) + .035 * cRng()));
    core.push([r * Math.cos(a), r * Math.sin(a)]);
  }
  // flat: a parede do miolo usa a cor dele, para ler como um volume único
  out.push({ pts: ccw(core), z0:0, z1: Math.max(.05, S.height / 100),
             top: RO.core || RO.bands[4], flat: true,
             order: raw(0, 0, 0).d });          // o miolo esta no centro
  return out;
}

const BUILDERS = { pyramid:piecesPyramid, twist:piecesTwist, stack:piecesStack,
                   tower:piecesTower, circle:piecesCircle };

/* ---------- projeção ---------- */
let view = { scale:1, cx:0, cy:0 };

function raw(x, y, z){
  const ca = Math.cos(S.rot), sa = Math.sin(S.rot);
  const rx = x * ca - y * sa, ry = x * sa + y * ca;
  const se = Math.sin(S.elev * DEG), ce = Math.cos(S.elev * DEG);
  return { x: rx, y: ry * se - z * ce, d: ry * ce + z * se };
}
const project = (x, y, z) => {
  const r = raw(x, y, z);
  return { x: view.cx + r.x * view.scale, y: view.cy + r.y * view.scale, d: r.d };
};

/* ---------- enquadramento estavel ---------- *
 * Duas camadas de cache, porque as duas coisas mudam em ritmos muito
 * diferentes:
 *
 *   NUVEM     amostra a geometria ao longo do ciclo e guarda cada ponto como
 *             o par (r, z), com r = hypot(x, y). Depende so da FORMA — layout,
 *             parametros, fase — e nunca da camera. Reamostrada apenas quando
 *             a forma muda.
 *   ENVELOPE  o retangulo que a nuvem ocupa na tela. Sai da nuvem mais a
 *             ELEVACAO, num laco sobre escalares: nao reconstroi geometria.
 *
 * Antes as duas eram a mesma funcao, e como `orbit` a invalidava, cada
 * pointermove reconstruia a geometria cinco vezes e reprojetava tudo em quatro
 * giros. Medido no Stack 22 com Rotate: 7.6ms num quadro limpo contra 24.7ms
 * arrastando — 40fps na interacao em que a resposta mais se sente.
 *
 * POR QUE (r, z). A projecao manda `rx = x*ca - y*sa` para a horizontal da
 * tela, e ao longo de uma volta inteira rx varre exatamente [-r, +r]. Na
 * vertical, `ry*se - z*ce` varre [-r*se - z*ce, +r*se - z*ce]. Nenhum dos dois
 * depende de S.rot: o envelope e a silhueta do solido de revolucao da nuvem.
 * Duas consequencias:
 *   - girar nao reescala mais nada. Antes o ajuste seguia o bbox PROJETADO,
 *     que muda com o angulo, entao a cena inchava e murchava enquanto se
 *     orbitava — medido: 24.7% de variacao de largura no Tower, 14.8% na
 *     Pyramid, 10.5% no Twist, numa volta;
 *   - a amostragem de giros se aposenta. Ela colhia 0/90/180/270 — multiplos
 *     de 90 — e num footprint quadrado os quatro angulos sao equivalentes por
 *     simetria, de modo que as quatro amostras eram a mesma e o extremo em 45
 *     ficava de fora. Agora nao se amostra angulo nenhum: a volta e coberta
 *     por construcao, e o WebM, que varre um giro completo, tambem.
 *
 * O PRECO, que e real: o envelope e a uniao de todos os angulos, logo e mais
 * largo que a silhueta de qualquer angulo isolado. A cena passa a caber no
 * quadro com menos justeza. Em troca, ela nao pulsa.                        */
let NUVEM = new Float64Array(0);                  // pares (r, z)
let FRAME = { minx:-1, maxx:1, miny:-1, maxy:1 };

function buildNuvem(){
  const savedP = S.phase;
  const phases = [0, .2, .4, .6, .8].map(u => u * TAU * S.cycles);
  const out = [];
  for (const dp of phases){
    S.phase = savedP + dp;
    for (const p of BUILDERS[S.layout]())
      for (const q of p.pts){
        const r = Math.sqrt(q[0] * q[0] + q[1] * q[1]);
        out.push(r, p.z0, r, p.z1);               // as duas tampas do prisma
      }
  }
  S.phase = savedP;
  NUVEM = Float64Array.from(out);
}

function buildEnv(){
  const se = Math.sin(S.elev * DEG), ce = Math.cos(S.elev * DEG);
  let R = 0, miny = 1e9, maxy = -1e9;
  for (let i = 0; i < NUVEM.length; i += 2){
    const r = NUVEM[i], z = NUVEM[i + 1];
    if (r > R) R = r;
    const alto = r * se - z * ce;                 // topo do circulo revolucionado
    const baixo = -r * se - z * ce;               // e a base dele
    if (alto > maxy) maxy = alto;
    if (baixo < miny) miny = baixo;
  }
  FRAME = NUVEM.length ? { minx:-R, maxx:R, miny, maxy }
                       : { minx:-1, maxx:1, miny:-1, maxy:1 };
}

/* view da tela: enquadramento estável + zoom + pan (pan em fração da largura) */
function viewFor(W, H){
  // zoom 100 = a cena preenche exatamente o quadro de export
  const b = cropBox(W, H);
  const w = Math.max(1e-3, FRAME.maxx - FRAME.minx);
  const h = Math.max(1e-3, FRAME.maxy - FRAME.miny);
  const s = .92 * Math.min(b.w / w, b.h / h) * (S.zoom / 100);
  return {
    scale: s,
    cx: b.x + b.w / 2 - (FRAME.minx + FRAME.maxx) / 2 * s + S.panX * W,
    cy: b.y + b.h / 2 - (FRAME.miny + FRAME.maxy) / 2 * s + S.panY * W
  };
}

/* retângulo do guia, em px do canvas */
function cropBox(W, H){
  // O palco inteiro: o painel nao ocupa mais um lado da tela para o guia
  // desviar dele — abre no centro, e sair da frente dele e fecha-lo.
  const A = EXP_ASPECT[S.expFormat] || (W / H);
  let w = W * .92, h = w / A;
  if (h > H * .92){ h = H * .92; w = h * A; }
  return { x: (W - w) / 2, y: (H - h) / 2, w, h };
}

/* tamanho do arquivo exportado */
function expDims(){
  const A = EXP_ASPECT[S.expFormat] || (canvas.width / canvas.height);
  const n = +S.expSize;                     // referência = lado menor (1080 => 1920x1080 em 16:9)
  let w = A >= 1 ? Math.round(n * A) : n;
  let h = A >= 1 ? n : Math.round(n / A);
  // dimensões pares: exigência prática dos codecs de vídeo
  return { w: w + (w % 2), h: h + (h % 2) };
}

/* ---------- desenho ---------- */
function poly(ctx, pts, fill){
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = fill;   // costura: mata os fios de antialiasing entre faces
  ctx.lineWidth = 1;
  ctx.stroke();
}

/* Cor é propriedade da FACE, no espaço da própria peça: cada aresta do
   footprint tem um papel fixo. Nada aqui olha para a câmera nem para a fase,
   então nenhuma face troca de cor durante a animação — sem luz simulada.
   Sombra também é por papel (fixa), não por orientação. */
const ROLE_SHADE = { a:0, b:.45, end:.2, in:.6 };

function prismFaces(piece){
  const { pts, z0, z1, top } = piece;
  const p = RO;
  const sh = S.shadow / 100;
  // centroide do footprint: origem do referencial em que a face e ordenada
  let fx = 0, fy = 0;
  for (const q of pts){ fx += q[0]; fy += q[1]; }
  fx /= pts.length; fy /= pts.length;
  const bot = pts.map(q => project(q[0], q[1], z0));
  const cap = pts.map(q => project(q[0], q[1], z1));
  const faces = [];
  for (let i = 0; i < pts.length; i++){
    const j = (i + 1) % pts.length;
    // papel da face: explícito na peça, ou alternado por aresta (opostas iguais)
    const role = piece.flat ? 'flat'
               : piece.roles ? piece.roles[i % piece.roles.length]
               : (i % 2 ? 'b' : 'a');
    const base = role === 'flat' ? top
               : role === 'end'  ? (p.end || p.a)
               : role === 'a'    ? p.a
               : p.b;
    const f = 1 - sh * (role === 'flat' ? .3 : ROLE_SHADE[role]);
    const q = [bot[i], bot[j], cap[j], cap[i]];
    /* CHAVE DE PROFUNDIDADE DA FACE: so o footprint, sem z nenhum.
       A media dos quatro cantos era
           (ry_i + ry_j) * ce/2  +  (z0 + z1) * se/2
       e o segundo termo e o MESMO nas quatro faces do prisma, logo nao deveria
       influir na ordem entre elas. Matematicamente nao influi; numericamente
       influi: somar um `c` que muda a cada quadro a dois valores quase iguais
       faz a comparacao inverter por arredondamento.
       E os valores ficam quase iguais o tempo todo, porque em rot -45 — o
       padrao de todos os presets — as duas faces laterais visiveis de um
       footprint QUADRADO tem profundidade exatamente igual. Com o Wave
       animando z1, o empate desempatava ao contrario toda hora, e a aresta
       vertical da caixa piscava entre os dois tons laterais: onda quadrada de
       80 niveis de luminancia, medida pixel a pixel no Stack e no Tower.
       Era isso o tremor desses dois layouts. Explica tambem por que era PIOR
       com Effector baixo: quanto menos a peca se desloca, mais perto do empate
       ela fica — no Tower o tremor caia de .69 em Effector 10 para .09 em 100,
       porque o desalinhamento lateral quebra a simetria.
       A chave sai do footprint, medido a partir do CENTROIDE DA PROPRIA PECA.
       As duas coisas importam. Tirar o z resolve o Stack, onde e a altura que
       anima. Medir a partir do centroide resolve o Tower, onde z e estatico e
       quem anima e o deslocamento lateral: as duas faces empatadas se deslocam
       pelo MESMO dx, dy, entao a diferenca entre elas nao muda mas o valor
       somado a ambas muda — e era esse valor que virava o desempate. No
       referencial do footprint, uma translacao rigida da peca sai da conta e a
       chave para de depender da fase.
       Nos dois casos a ordem e a MESMA de antes: as faces laterais cobrem o
       mesmo intervalo de z e a peca inteira desloca junto, entao as chaves
       diferem da media dos cantos por uma constante por peca e por quadro, que
       nao altera ordem nenhuma. Quando a peca GIRA (Pyramid, Twist) o
       referencial gira com ela e a ordem muda de verdade, como deve.
       Falta um detalhe, e ele e o que sobrava do tremor do Tower: em rot -45 as
       duas faces sao SIMETRICAS, o empate e exato, e o referencial relativo nao
       chega a zero exato em ponto flutuante — `(-1+dx + 1+dx)/2 - dx` deixa um
       residuo da ordem de 1e-16 que depende da fase. Empate exato mais qualquer
       residuo da inversao, e o desempate por indice so pega igualdade exata.
       Por isso a chave e QUANTIZADA: diferencas abaixo do piso de ruido viram
       empate de verdade, e o indice resolve sempre do mesmo jeito. O quantum
       fica seis ordens acima do ruido (1e-16) e muito abaixo de qualquer
       diferenca real de profundidade entre faces, que e da ordem de 0.1. */
    const mx = (pts[i][0] + pts[j][0]) / 2 - fx, my = (pts[i][1] + pts[j][1]) / 2 - fy;
    const dq = Math.round(raw(mx, my, 0).d * 1e9) / 1e9;
    faces.push({ pts:q, fill: shade(base, f), d: dq, i });
  }
  faces.sort((m, n) => m.d - n.d || m.i - n.i);
  faces.push({ pts: cap, fill: top, d: Infinity });
  return faces;
}

function drawScene(ctx, W, H, viewOverride){
  RO = roles();
  view = viewOverride || viewFor(W, H);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = RO.bg;
  ctx.fillRect(0, 0, W, H);
  /* ORDEM DE PINTURA.
     A chave era a profundidade do CENTROIDE 3D da peca, e isso trepidava: o
     centroide inclui `(z0+z1)/2 * se`, entao o Wave, que anima as alturas do
     Stack e o deslocamento lateral do Tower, animava a propria chave. Pecas em
     profundidade parecida ficavam invertendo a ordem de um quadro para o outro,
     e a cada inversao a regiao de sobreposicao trocava de cor.
     Medido (reversoes por diferenca significativa, 0 = movimento puro, 1 =
     piscada pura): Tower .591, Stack .337, contra Twist .016 e Circle .004. E
     pior com Effector BAIXO — .693 no Tower a 10 — que e a assinatura de
     empate: quanto menos a geometria se separa, mais a ordem oscila. Forcar
     todas as faces a uma cor unica levava as duas a ~.001, o que prova que o
     que piscava era a cor, nao a borda.

     Agora cada peca pode declarar `order`, porque quem conhece a estrutura de
     oclusao e o layout, nao o desenhador: os empilhados em z ordenam pela base,
     os que se apoiam no chao ordenam pela profundidade do FOOTPRINT. Nos dois
     casos a chave deixa de depender da fase. Sem `order` vale o centroide, que
     continua sendo o palpite razoavel para uma peca nova.

     As FACES de um prisma nao precisaram mudar: o termo `(z0+z1)/2 * se` e o
     mesmo nas quatro, logo nao entra na ordem relativa delas — a ordenacao de
     face depende so da orientacao do footprint, que o Wave nao mexe no Stack
     nem no Tower. */
  const items = BUILDERS[S.layout]().map(pc => {
    let d = pc.order;
    if (d === undefined){
      let sx = 0, sy = 0;
      for (const q of pc.pts){ sx += q[0]; sy += q[1]; }
      d = raw(sx / pc.pts.length, sy / pc.pts.length, (pc.z0 + pc.z1) / 2).d;
    }
    return { d, faces: prismFaces(pc) };
  });
  items.sort((m, n) => m.d - n.d);
  for (const it of items) for (const f of it.faces) poly(ctx, f.pts, f.fill);
}

/* render de export: usa a MESMA câmera da tela, recortada no guia */
function drawExport(ctx, W, H){
  const box = cropBox(canvas.width, canvas.height);
  const v = viewFor(canvas.width, canvas.height);
  const k = W / box.w;
  drawScene(ctx, W, H, { scale: v.scale * k, cx: (v.cx - box.x) * k, cy: (v.cy - box.y) * k });
}

function drawGuide(ctx, W, H){
  const b = cropBox(W, H);
  ctx.save();
  ctx.fillStyle = 'rgba(8,8,8,.5)';
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.rect(b.x, b.y, b.w, b.h);
  ctx.fill('evenodd');
  ctx.strokeStyle = 'rgba(255,255,255,.45)';
  ctx.lineWidth = Math.max(1, W / 1000);
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  ctx.restore();
}

const PRESETS = {
  pyramid: { count:6,  segments:2, effector:35, lobes:3, height:100, inner:30, gap:50, elev:34, bands:false },
  twist:   { count:22, segments:2, effector:60, lobes:2, height:150, inner:30, gap:12, elev:20, bands:true  },
  stack:   { count:9,  segments:2, effector:60, lobes:3, height:90,  inner:30, gap:16, elev:30, bands:false },
  tower:   { count:8,  segments:2, effector:15, lobes:2, height:145, inner:30, gap:25, elev:24, bands:false },
  circle:  { count:20, segments:1, effector:70, lobes:1, height:52,  inner:45, gap:35, elev:34, bands:false }
};

function download(url, name, revoke){
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  if (revoke) setTimeout(() => URL.revokeObjectURL(url), 8000);
}

function exportPNG(){
  const { w, h } = expDims();
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  drawExport(off.getContext('2d'), w, h);
  download(off.toDataURL('image/png'), `stacks3d-${S.layout}-${S.seed}-f${S.frame}.png`);
}

async function exportWebM(){
  const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mimeType = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!mimeType){ alert('Este navegador não suporta gravação em WebM.'); return; }

  const { w, h } = expDims();
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const octx = off.getContext('2d');
  const fps = +S.fps, total = totalFrames();

  const stream = off.captureStream(0);              // 0 = frames sob demanda
  const track = stream.getVideoTracks()[0];
  const rec = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: Math.round(w * h * fps * .12) });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const stopped = new Promise(r => { rec.onstop = r; });

  const btn = { textContent: '' };
  const savedPhase = S.phase, savedRot = S.rot, savedPlaying = S.playing;
  exporting = true;
  S.playing = false;
  

  rec.start();
  for (let f = 0; f < total; f++){
    const u = f / total;                            // 0..1 exclusivo => loop perfeito
    if (S.wave) S.phase = savedPhase + u * TAU * S.cycles;
    if (S.rotate) S.rot = savedRot + u * TAU;
    drawExport(octx, w, h);
    track.requestFrame();
    btn.textContent = `Gravando ${Math.round((f + 1) / total * 100)}%`;
    await new Promise(r => setTimeout(r, 1000 / fps));
  }
  rec.stop();
  await stopped;
  track.stop();

  S.phase = savedPhase; S.rot = savedRot; S.playing = savedPlaying;
  exporting = false;
  
  btn.textContent = 'Exportar WebM';

  const blob = new Blob(chunks, { type: mimeType });
  download(URL.createObjectURL(blob), `stacks3d-${S.layout}-${S.seed}-${w}x${h}.webm`, true);
}

  /* Reamostrar a nuvem e caro; refazer o envelope a partir dela e um laco
     sobre escalares. Por isso sao dois sinais, nao um: marca-se sujo e
     recalcula-se no maximo uma vez por quadro, logo antes de desenhar.

     Quem muda a FORMA obriga as duas coisas. Quem muda so a camera ou a cor
     refaz apenas o envelope. A classificacao vive aqui dentro, e nao na mao de
     quem chama, porque a casca nao sabe — nem deve saber — o que e forma e o
     que e camera neste motor: ela so repassa a chave do controle. */
  const CAMPOS_FORMA = new Set(['count','segments','effector','lobes','height',
                                'inner','gap','wave','phase','cycles','frame','seed']);
  let nuvemSuja = true, envSujo = true;
  const needFrame = () => { nuvemSuja = true; envSujo = true; };   // a forma mudou
  const needEnv   = () => { envSujo = true; };                     // so a camera
  const marcar = k => (CAMPOS_FORMA.has(k) ? needFrame : needEnv)();
  /* Chamado antes de todo desenho, inclusive os de export: sem isso um export
     disparado logo depois de mudar a forma sairia com o enquadramento velho. */
  const garantirFrame = () => {
    if (nuvemSuja){ buildNuvem(); nuvemSuja = false; envSujo = true; }
    if (envSujo){ buildEnv(); envSujo = false; }
  };

  const RANGES = {
    segments:[1,5], effector:[0,100], lobes:[1,12], height:[5,160], inner:[5,70], gap:[0,70]
  };
  const LABELS = { segments:'Segmentos', effector:'Effector', lobes:'Lóbulos',
                   height:'Altura', inner:'Miolo', gap:'Folga' };
  return {
    id: '3d',
    useCanvas: c => { canvas = c; },
    layouts: () => Object.entries(LAYOUTS).map(([k, l]) => ({ key:k, name:l.name })),
    layout: () => S.layout,
    setLayout: k => { S.layout = k; Object.assign(S, PRESETS[k]); needFrame(); },
    draw: (ctx, W, H) => { garantirFrame(); drawScene(ctx, W, H, null); },
    controls(){
      const L = LAYOUTS[S.layout], out = [];
      if (L.uses.includes('count'))
        out.push({ key:'count', label:L.label, min:L.min, max:L.max, value:S.count, suffix:'' });
      for (const k of ['segments','effector','lobes','height','inner','gap']){
        if (!L.uses.includes(k)) continue;
        out.push({ key:k, label: k === 'gap' ? L.gapLabel : LABELS[k],
                   min:RANGES[k][0], max:RANGES[k][1], value:S[k],
                   suffix: ['height','inner','gap'].includes(k) ? '%' : '' });
      }
      return out;
    },
    camera: () => [
      { key:'elev', label:'Elevação', min:6,  max:90,  value:S.elev,   suffix:'°' },
      { key:'zoom', label:'Zoom',     min:30, max:400, value:S.zoom,   suffix:'%' },
      { key:'shadow', label:'Sombra', min:0,  max:50,  value:S.shadow, suffix:'%' }
    ],
    motion: () => [{ key:'speed', label:'Ritmo', min:1, max:200, value:S.speed, suffix:'' }],
    toggles: () => [
      { key:'rotate', label:'Rotate', value:S.rotate },
      { key:'wave',   label:'Wave',   value:S.wave },
      { key:'mono',   label:'Monocromático', value:S.mono },
      { key:'bands',  label:'Tampas em faixas', value:S.bands }
    ],
    set: (k, v) => { S[k] = v; marcar(k); },
    get: k => S[k],
    toggle: k => { S[k] = !S[k]; marcar(k); },
    palettes: () => PALETTES.map((p, i) => ({ key:i, name:p.name, bg:p.bg, ink:p.top, bands:p.bands })),
    palette: () => S.palette,
    setPalette: k => { S.palette = +k; },
    seed: () => S.seed,
    // a semente entra na geometria — o miolo do Circle e sorteado dela — entao
    // sem isto a nuvem amostrada fica velha
    reseed: () => { S.seed = newSeed(); needFrame(); },
    // devolve se a cena mudou: sem Rotate nem Wave nada anda
    advance: dt => {
      if (!S.rotate && !S.wave) return false;
      const sp = S.speed / 100;
      if (S.rotate) S.rot += dt / 1000 * sp * .7;
      if (S.wave) S.phase += dt / 1000 * sp * 1.6;
      return true;
    },
    snapshot: () => Object.assign({}, S),
    restore: o => { Object.assign(S, o); needFrame(); },
    accent: () => PALETTES[S.palette].top,
    setAccent: c => { PALETTES[S.palette].top = c; },
    // o envelope e invariante ao giro, entao arrastar na horizontal nao
    // invalida nada; so a elevacao move o envelope, e agora sem reconstruir
    // geometria nenhuma
    orbit: (dx, dy) => { S.rot += dx * .006; S.elev = clamp(S.elev - dy * .18, 6, 90); needEnv(); },
    zoomBy: d => { S.zoom = clamp(S.zoom - d * .06, 30, 400); },
    formats: () => Object.entries(EXP_ASPECT).map(([k, a]) => ({ key:k, a })),
    format: () => S.expFormat,
    setFormat: k => { S.expFormat = k; },
    exportPNG: () => { garantirFrame(); exportPNG(); },
    exportWebM: () => { garantirFrame(); exportWebM(); },
    hasVideo: true,
    // o guia mostra o recorte que o export ja aplica — sem ele o corte e invisivel
    drawGuide: (ctx, W, H) => drawGuide(ctx, W, H),
    video: () => [
      { key:'dur',    label:'Duração', min:1, max:12,  value:S.dur,    suffix:'s' },
      { key:'fps',    label:'FPS',     min:12, max:60, value:+S.fps,   suffix:'' },
      { key:'cycles', label:'Ciclos',  min:1, max:4,   value:S.cycles, suffix:'' },
      { key:'frame',  label:'Frame',   min:0, max:Math.max(1, totalFrames() - 1), value:S.frame, suffix:'' }
    ],
    setVideo: (k, v) => {
      S[k] = v;
      if (k === 'frame') S.phase = v / totalFrames() * TAU * S.cycles;   // scrub determinístico
      marcar(k);
    }
  };
})();

/* ---------------------------- a casca ---------------------------- */
/* Estado no hash da URL: recarregar nao perde nada e o link e compartilhavel.
   Escrito com atraso, porque um arraste de slider dispara dezenas de eventos
   e replaceState a cada um seria desperdicio. */
let hashTimer = 0;
/* O estado inteiro numa string. O hash da barra de endereco e o do embed sao
   o MESMO texto: gerar cada um do seu jeito era combinar que um dia iam
   divergir, e um embed com estado diferente do link e um embed errado. */
function estadoEmTexto(){
  const o = { e: APP.eng.id, s: APP.eng.snapshot() };
  return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/, '');
}
function escreverHash(){
  clearTimeout(hashTimer);
  // O hash e escrito com atraso porque arrastar um controle o reescreveria a
  // cada quadro; por isso quem precisa do estado AGORA chama estadoEmTexto().
  hashTimer = setTimeout(() => {
    try { history.replaceState(null, '', '#' + estadoEmTexto()); }
    catch (e){ /* hash e conveniencia: nunca derruba a pagina */ }
  }, 300);
}
function lerHash(){
  if (location.hash.length < 2) return false;
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
    const eng = ENGINES[o.e];
    if (!eng || !o.s) return false;
    APP.eng = eng;
    eng.restore(o.s);
    return true;
  } catch (e){ return false; }
}
const $ = id => document.getElementById(id);
const stage = $('stage');
const sctx = stage.getContext('2d');
ENG3D.useCanvas(stage);

const APP = { eng: ENG2D, tab: 'assets', playing: true, busca: '', guia: false, caixa: null };
/* As caixas que a barra abre, e o botao que abre cada uma. O painel disputa
   o mesmo lugar (ver abrir()), mas nao e um popover: mora no HTML.       */
const POPS = { pal:['popPal', 'btPal'], menu:['popMenu', 'btExport'] };
/* Decidido no <head>, antes do primeiro quadro; aqui so se le o que ja foi
   decidido, para nao haver duas leituras da mesma pergunta. */
const EMBED = document.documentElement.classList.contains('embed');
const ENGINES = { '2d': ENG2D, '3d': ENG3D };

/* Reconcilia o tamanho a cada quadro em vez de confiar so no evento de
   resize: se a pagina abre oculta ou sem layout, innerWidth vem 0, o canvas
   fica 0x0 e nada mais o conserta. Assim ele se cura sozinho.
   Devolve true quando o tamanho mudou — redimensionar limpa o canvas, entao
   obriga a repintar. */
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round((window.innerWidth || document.documentElement.clientWidth) * dpr));
  const h = Math.max(1, Math.round((window.innerHeight || document.documentElement.clientHeight) * dpr));
  if (stage.width === w && stage.height === h) return false;
  stage.width = w; stage.height = h;
  // O canvas e um elemento SUBSTITUIDO: com o tamanho declarado so nos
  // atributos, `inset:0` NAO estica a caixa — para width/height em `auto` o
  // tamanho usado e o intrinseco, e a equacao super-restringida e resolvida
  // ignorando right/bottom. Ou seja: a caixa ficava do tamanho do ATRIBUTO,
  // em px de CSS. Num monitor dpr>1 isso deixava a tela `dpr` vezes maior que
  // a viewport, ancorada no topo-esquerdo — via-se so 1/dpr da composicao
  // (medido: 70% da largura em dpr 1.5, 50% em dpr 2), e reescalada, o que
  // borra a borda animada e faz todo o trabalho de encaixar em pixel inteiro
  // ser jogado fora na reamostragem. Em dpr 1 o codigo acertava por acidente,
  // que e por que isso passou tanto tempo em pe.
  //
  // Dividir pelo MESMO dpr usado no backing store da 1 px de canvas = 1 px
  // fisico, exato. (Com dpr > 2 o teto ainda reamostra: e uma escolha de
  // desempenho, nao um descuido.)
  stage.style.width  = w / dpr + 'px';
  stage.style.height = h / dpr + 'px';
  return true;
}

/* So se desenha quando algo muda. Parado, ou com um template estatico, o
   quadro identico deixa de ser repintado 60 vezes por segundo — o que num
   monitor 4K devolve um terco do orcamento de cada quadro. Toda mutacao de
   estado passa por invalidate(). */
let dirty = true;
const invalidate = () => { dirty = true; escreverHash(); };

let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  const cresceu = resize();
  const dt = last ? Math.min(now - last, 100) : 16;
  last = now;
  try {
    if (APP.playing && APP.eng.advance(dt)) dirty = true;
    if (dirty || cresceu){
      APP.eng.draw(sctx, stage.width, stage.height);
      if (APP.guia && APP.eng.drawGuide) APP.eng.drawGuide(sctx, stage.width, stage.height);
      dirty = false;
    }
  } catch (e){ console.error('quadro falhou:', e); }
}

/* ---------- miniaturas ---------- *
 * Desenhadas uma vez por (motor, template, paleta) e guardadas: a busca so
 * filtra, entao redesenhar tudo a cada tecla era trabalho jogado fora.
 *
 * O estado do motor e salvo e restaurado em volta do desenho. Antes daqui se
 * voltava com setLayout, que reaplica o PRESET — e isso apagava os ajustes
 * que o usuario tivesse feito no template aberto.                          */
const THUMBS = new Map();
function thumbCanvas(eng, key){
  const chave = eng.id + '/' + key + '/' + eng.palette() + '/' + eng.accent();
  let cv = THUMBS.get(chave);
  if (cv) return cv;
  cv = document.createElement('canvas');
  cv.width = 132; cv.height = 132;
  const estado = eng.snapshot();
  eng.setLayout(key);
  try { eng.draw(cv.getContext('2d'), cv.width, cv.height); } catch (e){ /* ignora */ }
  eng.restore(estado);
  THUMBS.set(chave, cv);
  return cv;
}

/* ---------- aviso ---------- *
 * Uma acao que so acontece FORA da tela — copiar um link, sortear uma
 * semente, gravar um video — nao dava sinal nenhum de ter acontecido. O
 * aviso e o recibo: aparece, diz o que foi feito, e sai sozinho.          */
let avisoTimer = 0;
function aviso(txt, ms){
  const el = $('aviso');
  el.textContent = txt;
  el.classList.add('on');
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(() => el.classList.remove('on'), ms || 2000);
}

/* ---------- aba Assets ---------- */
function renderAssets(){
  const corpo = $('corpo');
  corpo.innerHTML = '';
  const q = APP.busca.trim().toLowerCase();
  let achou = 0;

  for (const [id, eng] of Object.entries(ENGINES)){
    const itens = eng.layouts().filter(l => !q || l.name.toLowerCase().includes(q) || id.includes(q));
    if (!itens.length) continue;
    achou += itens.length;

    const g = document.createElement('div');
    g.className = 'grupo';

      '<div class="gcab">' +
        '<span class="gmarca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">' +
        '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></span>' +
        '<span><span class="gtitulo">' + id.toUpperCase() + '</span><br>' +
        '<span class="gsub">' + itens.length + (itens.length === 1 ? ' template' : ' templates') + '</span></span>' +
      '</div>';
    const row = document.createElement('div');
    row.className = 'capas';
    for (const l of itens){
      const b = document.createElement('button');
      b.className = 'capa';

      b.setAttribute('aria-pressed', String(APP.eng === eng && eng.layout() === l.key));
      b.appendChild(thumbCanvas(eng, l.key));
      b.addEventListener('click', () => {
        // fica na aba: quem esta escolhendo costuma clicar em varios seguidos.
        // O Editor esta a uma aba de distancia quando a escolha estiver feita.
        const jaAtivo = APP.eng === eng && eng.layout() === l.key;
        APP.eng = eng;
        if (!jaAtivo) eng.setLayout(l.key);   // reclicar nao reaplica o preset
        invalidate();
        render();
      });
      row.appendChild(b);
    }
    g.appendChild(row);
    corpo.appendChild(g);
  }
  if (!achou){
    const p = document.createElement('div');
    p.className = 'vazio';
    p.innerHTML = 'Nenhum template com <b>' + APP.busca.replace(/[<>&]/g, '') + '</b>.';

    b.textContent = 'Limpar busca';
    b.addEventListener('click', limparBusca);
    p.appendChild(b);
    corpo.appendChild(p);
  }
}

/* O select nao aceita pseudo-elemento, e a seta precisa de um elemento nosso
   para morar: dentro da data URI de um background-image ela era --dim copiado
   a mao, e nenhuma troca do token a alcancava. */
function comSeta(sel){

/* A trilha do slider e pintada ate o valor: parado, o controle ja diz onde
   esta dentro da faixa, sem precisar comparar o punho com as pontas. */
function pintarTrilha(inp){
  const min = +inp.min, max = +inp.max;
  const p = max > min ? ((+inp.value - min) / (max - min)) * 100 : 0;
  inp.style.setProperty('--fill', p.toFixed(2) + '%');
}
function slider(c, eng, ctl, onSet){
  const row = document.createElement('div');
  row.className = 'linha';
  row.innerHTML = '<span class="rotulo">' + ctl.label + '</span>' +
                  '<span class="chip">' + ctl.value + ctl.suffix + '</span>';
  const chip = row.querySelector('.chip');
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = ctl.min; inp.max = ctl.max; inp.step = 1; inp.value = ctl.value;
  inp.dataset.fk = eng.id + ':' + ctl.key;          // ancora para devolver o foco
  inp.setAttribute('aria-label', ctl.label);
  pintarTrilha(inp);
  let apaga = 0;
  inp.addEventListener('input', e => {
    const v = +e.target.value;
    chip.textContent = v + ctl.suffix;
    chip.classList.add('vivo');
    clearTimeout(apaga);
    apaga = setTimeout(() => chip.classList.remove('vivo'), 700);
    pintarTrilha(e.target);
    (onSet || eng.set)(ctl.key, v);
    invalidate();
  });
  c.appendChild(row);
  c.appendChild(inp);
}

/* ---------- levar a peca para outro site ----------
 * Duas saidas, porque sao dois usos. O HTML estatico leva a peca DENTRO do
 * arquivo: um quadro em vetor, sem JS, sem depender de nada continuar no ar
 * — e por isso so existe onde ha vetor. O embed leva um endereco: continua
 * animado e vale para todos os templates, ao preco de o site alheio passar a
 * depender desta pagina.                                                  */
const CLASSE = 'peca-generativa';
/* Onde ESTA pagina esta servida e de onde o embed vai viver. Aberta do disco
   nao ha endereco que sirva a um site, entao cai para onde ela esta
   publicada — um embed apontando para file:// nao carrega em lugar nenhum. */
function base(){
  return location.protocol.indexOf('http') === 0
    ? location.origin + location.pathname
    : 'https://lucasbatistaribeiro.github.io/animations/';
}
function nomeDoTemplate(){
  const l = APP.eng.layouts().find(l => l.key === APP.eng.layout());
  return l ? l.name : APP.eng.layout();
}
/* `aspect-ratio:1.7778` no CSS de um site alheio nao diz nada; `16 / 9` diz.
   O motor entrega a razao como numero, e a fracao e reconstruida aqui — uma
   segunda tabela de formatos seria mais uma tabela para sair do lugar. */
function razao(a){
  for (let d = 1; d <= 32; d++){
    const n = a * d;
    if (Math.abs(n - Math.round(n)) < 1e-6) return Math.round(n) + ' / ' + d;
  }
  return String(Math.round(a * 1e4) / 1e4);
}
function assinaturaDaPeca(){
  return '<!-- ' + nomeDoTemplate() + ' — semente ' + APP.eng.seed() + ' — ' +
         'gerado em ' + base() + ' -->';
}
function htmlEstatico(){
  return [
    assinaturaDaPeca(),
    '<figure class="' + CLASSE + '">',
    APP.eng.svgSource().replace(/^/gm, '  '),
    '</figure>',
    '',
    '<style>',
    '.' + CLASSE + '{margin:0;line-height:0}',
    // Largura do site, altura pela razao do proprio vetor: assim a peca cabe
    // em qualquer coluna sem nunca distorcer.
    '.' + CLASSE + ' svg{display:block;width:100%;height:auto}',
    '</style>'
  ].join('\n');
}
function htmlEmbed(){
  const f = APP.eng.formats().find(f => f.key === APP.eng.format());
  const nome = nomeDoTemplate();
  return [
    assinaturaDaPeca(),
    '<div class="' + CLASSE + '">',
    '  <iframe src="' + base() + '?embed#' + estadoEmTexto() + '"',
    '          title="' + nome + '" loading="lazy"></iframe>',
    '</div>',
    '',
    '<style>',
    // A razao segura a altura antes de o iframe carregar: sem ela a caixa
    // nasce com 150px de altura padrao e o site pula quando a arte entra.
    '.' + CLASSE + '{position:relative;aspect-ratio:' + razao(f ? f.a : 1) + '}',
    '.' + CLASSE + ' iframe{position:absolute;inset:0;width:100%;height:100%;border:0}',
    '</style>'
  ].join('\n');
}
/* A area de transferencia moderna exige origem segura: aberta do disco, ou
   servida por http simples numa rede local, ela simplesmente nao existe — e
   um snippet que nao chega a lugar nenhum e uma saida que nao existe. O
   caminho antigo, selecionar um textarea fora de tela e mandar copiar, ainda
   funciona nesses casos. */
async function copiar(texto, ok){
  try {
    if (navigator.clipboard){ await navigator.clipboard.writeText(texto); aviso(ok); return; }
  } catch (e){ /* segue para o caminho antigo */ }
  const ta = document.createElement('textarea');
  ta.value = texto;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let foi = false;
  try { foi = document.execCommand('copy'); } catch (e){ /* foi fica falso */ }
  ta.remove();
  aviso(foi ? ok : 'O navegador bloqueou a área de transferência');
}

function renderMenu(){
  const m = $('popMenu');
  m.innerHTML = '';
  const item = (rot, extra, fn) => {
    const b = document.createElement('button');
    b.setAttribute('role', 'menuitem');
    b.innerHTML = '<span>' + rot + '</span>' + (extra ? '<b>' + extra + '</b>' : '');
    b.addEventListener('click', () => { fecharPops(); fn(); });
    m.appendChild(b);
  };
  item('Exportar PNG', APP.eng.format(), () => APP.eng.exportPNG());
  if (APP.eng.exportSVG) item('Exportar SVG', 'vetor', () => APP.eng.exportSVG());
  if (APP.eng.hasVideo) item('Exportar WebM', 'loop', async () => {
    // A gravacao roda quadro a quadro e leva segundos: sem aviso, o botao
    // parecia nao ter feito nada e se clicava de novo no meio da gravacao.
    aviso('Gravando WebM…', 60000);
    try { await APP.eng.exportWebM(); aviso('WebM pronto'); }
    catch (e){ aviso('A gravação falhou'); }
  });
  let d = document.createElement('div'); d.className = 'div'; m.appendChild(d);
  item('Nova semente', APP.eng.seed(), () => { APP.eng.reseed(); invalidate(); render(); aviso('Nova semente: ' + APP.eng.seed()); });
  d = document.createElement('div'); d.className = 'div'; m.appendChild(d);
  item('Copiar link', '', async () => {
    escreverHash();
    setTimeout(async () => {
      try { await navigator.clipboard.writeText(location.href); aviso('Link copiado'); }
      catch (e){ aviso('Não deu para copiar — o link está na barra de endereço'); }
    }, 350);
  });
  // Só onde ha vetor: sem svgSource() o snippet estatico seria um PNG em
  // base64 fingindo ser HTML.
  if (APP.eng.svgSource) item('Copiar HTML', 'SVG inline', () => copiar(htmlEstatico(), 'HTML copiado — cole no site'));
  item('Copiar embed', 'iframe', () => copiar(htmlEmbed(), 'Embed copiado — cole no site'));
  item('Código no GitHub', '', () => window.open('https://github.com/lucasbatistaribeiro/animations', '_blank'));
  d = document.createElement('div'); d.className = 'div'; m.appendChild(d);
  const teclas = document.createElement('div');
  teclas.className = 'teclas';
  teclas.innerHTML =
    '<span><kbd>espaço</kbd> play</span>' +
    '<span><kbd>N</kbd> semente</span>' +
    '<span><kbd>E</kbd> PNG</span>' +
    '<span><kbd>H</kbd> painel</span>' +
    '<span><kbd>/</kbd> buscar</span>' +
    '<span><kbd>esc</kbd> fechar</span>';
  m.appendChild(teclas);
}

/* ---------- render geral ---------- *
 * A troca de aba e a troca de template refazem o painel inteiro, e por isso
 * ganham a entrada em cascata. Um clique num toggle refaz o MESMO conteudo:
 * ali a cascata seria uma piscada, e o que importa e nao perder a rolagem
 * nem o foco do teclado — que e o que a assinatura abaixo decide.        */
let assinatura = '';
function render(){
  const corpo = $('corpo');
  const rolagem = corpo.scrollTop;
  const foco = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.fk;

  $('painel').classList.toggle('oculto', APP.caixa !== 'painel');
  medirBarra();
  $('btMenu').setAttribute('aria-pressed', String(APP.caixa === 'painel'));
  const rotMenu = APP.caixa === 'painel' ? 'Esconder o painel (H)' : 'Mostrar o painel (H)';
  $('btMenu').title = rotMenu;
  $('btMenu').setAttribute('aria-label', rotMenu);
  // As tres saem do mesmo APP.caixa: enquanto cada uma tinha o seu proprio
  // liga-desliga, duas podiam estar ligadas ao mesmo tempo.
  for (const k in POPS){
    const [pop, bt] = POPS[k];
    $(pop).classList.toggle('on', APP.caixa === k);
    $(bt).setAttribute('aria-expanded', String(APP.caixa === k));
  }

  $('abaAssets').setAttribute('aria-selected', String(APP.tab === 'assets'));
  $('abaEditor').setAttribute('aria-selected', String(APP.tab === 'editor'));
  $('abaAssets').tabIndex = APP.tab === 'assets' ? 0 : -1;
  $('abaEditor').tabIndex = APP.tab === 'editor' ? 0 : -1;
  $('buscaWrap').style.display = APP.tab === 'assets' ? '' : 'none';

  const nova = APP.tab === 'assets' ? 'assets' : 'editor/' + APP.eng.id + '/' + APP.eng.layout();
  const anima = nova !== assinatura;
  assinatura = nova;

  corpo.classList.remove('anima');
  if (APP.tab === 'assets') renderAssets(); else renderEditor();
  if (anima){
    // reflow para reiniciar a animacao quando a classe volta no mesmo quadro
    void corpo.offsetWidth;
    corpo.classList.add('anima');
    [].forEach.call(corpo.children, (el, i) => el.style.setProperty('--i', i));
    corpo.scrollTop = 0;
  } else {
    corpo.scrollTop = rolagem;
    if (foco){
      const alvo = corpo.querySelector('[data-fk="' + foco + '"]');
      if (alvo) alvo.focus();
    }
  }

  moverTinta();
  renderPal();
  const tocando = APP.playing;
  $('icoPlay').innerHTML = tocando
    ? '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  const rotPlay = (tocando ? 'Pausar' : 'Tocar') + ' (espaço)';
  $('btPlay').title = rotPlay;
  $('btPlay').setAttribute('aria-label', rotPlay);
  // O cursor conta que o canvas responde ao arraste: nos templates 3D esse e
  // o unico lugar onde a orbita se anuncia.
  stage.style.cursor = APP.eng.orbit ? 'grab' : 'default';
}

/* As caixas centradas param antes da barra, e para isso precisam saber
   quanto ela ocupa. offsetHeight e o computed style, e nao o rect: a barra
   entra com um translate, e medir o rect durante a animacao daria a altura
   de um lugar por onde ela so passou. */
function medirBarra(){
  const b = document.querySelector('.barra');
  const desloc = parseFloat(getComputedStyle(b).bottom) || 0;
  document.documentElement.style.setProperty('--barra', Math.round(b.offsetHeight + desloc) + 'px');
}

/* A tinta desliza ate a aba ativa. Medir na hora — e nao guardar posicoes —
   e o que faz isso continuar certo quando a fonte carrega tarde ou o painel
   muda de largura. */
function moverTinta(){
  const alvo = APP.tab === 'assets' ? $('abaAssets') : $('abaEditor');
  const t = $('tinta');
  t.style.width = alvo.offsetWidth + 'px';
  t.style.transform = 'translateX(' + alvo.offsetLeft + 'px)';
}

/* ---------- eventos ---------- */
function irPara(aba){
  if (APP.tab === aba) return;
  APP.tab = aba;
  render();
}
$('abaAssets').addEventListener('click', () => irPara('assets'));
$('abaEditor').addEventListener('click', () => irPara('editor'));
// Setas percorrem as abas, como manda o padrao de tablist.
$('abaAssets').parentNode.addEventListener('keydown', e => {

/* Quem ocupa o canto direito do campo: a tecla enquanto ele esta vazio, o X
   assim que ha texto. Os dois nunca coexistem. O foco fica com o CSS. */
function cantoDaBusca(){
  const tem = !!APP.busca;
  $('limpar').classList.toggle('on', tem);
  $('atalho').classList.toggle('on', !tem);
}
function limparBusca(){
  APP.busca = '';

});

/* ---------- as tres caixas ----------
 * Painel, paleta e menu abrem no mesmo lugar, entao sao UM estado e nao tres
 * liga-desligas: com tres, clicar na paleta com o painel aberto empilhava uma
 * caixa em cima da outra, e a de baixo continuava clicavel pelas beiradas.
 * E a que entra espera a que sai TERMINAR de sair — cruzar as duas animacoes
 * ainda e ver duas caixas ao mesmo tempo, so que em movimento.           */
/* A espera vem do CSS: com o numero copiado para ca, mexer em --t-3 e
   esquecer deste lado poria a nova caixa por cima do rabo da anterior.   */
const SAIDA = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--t-3')) || 300;
let entrando = 0;

function abrir(qual, depois){
  const antes = APP.caixa;
  clearTimeout(entrando);
  // Pedir o que ja esta aberto nao fecha e reabre: seria uma piscada de 300ms
  // no caminho de quem so trocou de aba.
  if (qual === antes){ render(); if (depois) depois(); return; }
  APP.caixa = null;
  render();
  if (!qual) return;
  entrando = setTimeout(() => {
    APP.caixa = qual;
    if (POPS[qual]){
      // Conteudo e posicao ANTES de aparecer: posicionar mede a caixa, e
      // medir uma que ainda vai crescer erra pelo que falta crescer.
      if (qual === 'pal') renderPal(); else renderMenu();
      posicionar($(POPS[qual][0]));
    }
    render();
    if (depois) depois();
  }, antes ? SAIDA : 0);
}

/* No meio da janela na horizontal, e logo acima da barra na vertical: a
   caixa foi pedida ali, e e para la que a mao volta. Centrada nos dois eixos
   ela parava a meio caminho do botao que a abriu — e do que fecha. A barra e
   medida na hora: ela muda de altura no estreito. O teto de altura e do CSS.
   O rect da barra, e nao o do botao: o botao tem o padding dela por fora, e
   medir por ele encostava a caixa 11px mais para baixo do que se ve.     */
function posicionar(el){
  const barra = document.querySelector('.barra').getBoundingClientRect();
  el.style.left = Math.max(12, (window.innerWidth - el.offsetWidth) / 2) + 'px';
  el.style.top = Math.max(12, barra.top - el.offsetHeight - 12) + 'px';
}

/* Clique fora e Esc fecham o que flutua sobre a arte. O painel fica de fora:
   arrastar o canvas para orbitar tambem e um clique fora, e perder o painel
   a cada arrasto seria perder de vista o que se estava ajustando.        */
function fecharPops(){ if (POPS[APP.caixa]) abrir(null); }

$('btPal').addEventListener('click', e => { e.stopPropagation(); abrir(APP.caixa === 'pal' ? null : 'pal'); });
$('btExport').addEventListener('click', e => { e.stopPropagation(); abrir(APP.caixa === 'menu' ? null : 'menu'); });
document.addEventListener('click', e => {
  if (!e.target.closest('.pop') && !e.target.closest('.barra')) fecharPops();
});

/* orbita do 3D direto no canvas */
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (!APP.eng.orbit) return;              // capacidade, nao identidade do motor
  drag = { x:e.clientX, y:e.clientY };
  stage.style.cursor = 'grabbing';
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  APP.eng.orbit(e.clientX - drag.x, e.clientY - drag.y);
  invalidate();
  drag = { x:e.clientX, y:e.clientY };
});
stage.addEventListener('pointerup', () => { drag = null; if (APP.eng.orbit) stage.style.cursor = 'grab'; });
// Num embed a roda e do site que hospeda: dar zoom aqui roubaria a rolagem
// da pagina de quem colou a peca. O arraste fica — ele nao impede rolar.
if (!EMBED) stage.addEventListener('wheel', e => {
  if (!APP.eng.zoomBy) return;
  e.preventDefault();
  APP.eng.zoomBy(e.deltaY);
  invalidate();
}, { passive:false });

// Idem para o teclado: dentro de um iframe com foco, o espaco daria play em
// vez de rolar a pagina do site, e nao ha barra ali para explicar por que.
if (!EMBED) document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ fecharPops(); return; }
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  // Num botao com foco, espaco ja e o clique dele: disparar tambem o
  // play/pause faria um clique de teclado valer por dois comandos.
  if (e.code === 'Space'){
    if (e.target.tagName === 'BUTTON') return;
    e.preventDefault(); APP.playing = !APP.playing; render();
    return;
  }
  if (k === 'n'){ APP.eng.reseed(); invalidate(); render(); aviso('Nova semente: ' + APP.eng.seed()); }
  if (k === 'e') APP.eng.exportPNG();
  if (k === 'h') abrir(APP.caixa === 'painel' ? null : 'painel');
  if (k === '/'){
    e.preventDefault();
    APP.tab = 'assets';
    // O foco vai junto, mas so depois: com o painel fechado ele entraria num
    // campo que ainda nao esta na tela.
    abrir('painel', () => { $('busca').focus(); $('busca').select(); });
  }
});

window.addEventListener('resize', () => {
  resize(); moverTinta(); medirBarra();
  // as posicoes dos popovers foram calculadas contra a janela antiga
  fecharPops();
});

/* Handle para o test.html, que dirige esta pagina dentro de um iframe.
   Declaracoes com const nao viram propriedade de window, e sem isso o
   harness nao alcanca os motores — e testar uma copia nao testaria nada. */
window.__gerador = { ENGINES, APP, render, invalidate };

resize();
lerHash();
render();
requestAnimationFrame(frame);
</script>
</body>
</html>

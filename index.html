<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador — formas generativas</title>
<meta name="description" content="Gerador de assets generativos: formas 2D e blocos extrudados 3D, direto no navegador.">
<style>
  :root{
    --bg:#000;
    --panel:#0e0e0f;
    --card:#151517;
    --line:#242427;
    --txt:#f2f2f3;
    --dim:#8b8b90;
    --accent:#2f7bff;
    }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--txt);overflow:hidden;
    font:13px/1.45 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas#stage{position:fixed;inset:0;display:block}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#2a2a2d;border-radius:4px}

  /* ---------- painel ---------- */
  .panel{
    position:fixed;left:24px;top:24px;bottom:110px;width:320px;z-index:5;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .tabs{display:flex;gap:22px;padding:16px 20px 0;border-bottom:1px solid var(--line)}
  .tab{
    display:flex;align-items:center;gap:7px;padding:0 2px 11px;
    font-size:13.5px;font-weight:600;color:var(--dim);
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab[aria-selected=true]{color:var(--txt);border-bottom-color:var(--accent)}
  .tab svg{width:15px;height:15px}
  .tab[aria-selected=true] .plus{color:var(--accent)}
  .search{padding:14px 20px 4px;position:relative}
  .search svg{position:absolute;left:33px;top:50%;transform:translateY(-38%);width:14px;height:14px;color:var(--dim)}
  .search input{
    width:100%;background:#141416;border:1px solid var(--line);border-radius:999px;
    padding:9px 14px 9px 34px;color:var(--txt);font:inherit;font-size:12.5px;
  }
  .search input::placeholder{color:#6d6d72}
  .search input:focus{outline:1px solid #33333a;border-color:#33333a}
  .body{flex:1;overflow-y:auto;padding:14px 20px 22px;display:flex;flex-direction:column;gap:14px}

  /* ---------- cards de asset ---------- */
  .group{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .ghead{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .gmark{
    width:32px;height:32px;border-radius:9px;background:#202024;
    display:grid;place-items:center;color:var(--txt);flex:0 0 32px;
  }
  .gmark svg{width:16px;height:16px}
  .gtitle{font-size:13.5px;font-weight:600;line-height:1.2}
  .gsub{font-size:11.5px;color:var(--dim);line-height:1.2}
  .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .thumb{
    position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;
    background:#0a0a0b;border:1px solid transparent;padding:0;display:block;
  }
  .thumb canvas{width:100%;height:100%;display:block}
  .thumb:hover{border-color:#3a3a40}
  .thumb[aria-pressed=true]{border-color:var(--accent)}
  .empty{color:var(--dim);font-size:12px;padding:8px 2px}

  /* ---------- cards de controle ---------- */
  .ctl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .ctl + .ctl{margin-top:0}
  .crow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
  .clabel{font-size:12.5px;font-weight:600}
  .chip{
    min-width:42px;text-align:center;font-size:11px;font-variant-numeric:tabular-nums;
    color:var(--txt);background:#202024;border-radius:999px;padding:3px 9px;
  }
  .csub{font-size:11px;color:var(--dim);margin-top:9px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:#2a2a2f;border-radius:3px;margin:0;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#fff;cursor:pointer;border:0;
  }
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;cursor:pointer}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{
    flex:1;min-width:56px;padding:7px 6px;border-radius:9px;background:#1c1c20;
    border:1px solid transparent;font-size:11.5px;color:var(--dim);
  }
  .seg button[aria-pressed=true]{background:#26262c;border-color:#3a3a42;color:var(--txt)}
  select{
    width:100%;background:#1c1c20;border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;color:var(--txt);font:inherit;font-size:12px;
  }

  /* ---------- barra de baixo ---------- */
  .dock{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;
    display:flex;align-items:center;gap:14px;padding:10px 12px;
    background:#141416;border:1px solid var(--line);border-radius:16px;
    box-shadow:0 18px 50px rgba(0,0,0,.65);
  }
  .dock .ico{
    width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--txt);
  }
  .dock .ico:hover{background:#202024}
  .dock .ico svg{width:17px;height:17px}
  .sep{width:1px;height:26px;background:#2a2a2f}
  .pal{
    display:flex;align-items:center;gap:8px;padding:5px 9px 5px 6px;
    border-radius:999px;background:#1c1c20;
  }
  .pal:hover{background:#232329}
  .dots{display:flex}
  .dots i{width:22px;height:22px;border-radius:50%;border:2px solid #141416}
  .dots i + i{margin-left:-9px}
  .pal svg{width:12px;height:12px;color:var(--dim)}
  .export{
    display:flex;align-items:center;gap:9px;padding:9px 16px;border-radius:11px;
    background:#202024;font-size:12.5px;font-weight:600;
  }
  .export:hover{background:#2a2a30}
  .export svg{width:15px;height:15px}

  /* ---------- popovers ---------- */
  .pop{
    position:fixed;z-index:7;background:#141416;border:1px solid var(--line);
    border-radius:16px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.65);
    display:none;
  }
  .pop.on{display:block}
  .pop h3{margin:0 0 12px;font-size:13.5px;font-weight:600}
  .swatches{display:flex;gap:10px;align-items:center;margin-bottom:14px}
  .swatches button{width:44px;height:44px;border-radius:50%;border:2px solid transparent}
  .swatches button[aria-pressed=true]{border-color:#fff}
  .ramp{display:flex;height:44px;border-radius:11px;overflow:hidden}
  .ramp button{flex:1;border:0;position:relative}
  .ramp button[aria-pressed=true]::after{
    content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
    border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);
  }
  .menu{width:250px}
  .menu button{
    display:flex;width:100%;justify-content:space-between;gap:12px;padding:9px 10px;
    border-radius:9px;font-size:12.5px;color:var(--txt);text-align:left;
  }
  .menu button:hover{background:#1e1e22}
  .menu button b{color:var(--dim);font-weight:400;font-variant-numeric:tabular-nums}
  .menu .div{height:1px;background:var(--line);margin:7px 0}

  @media (max-width:820px){
    .panel{left:12px;right:12px;width:auto;bottom:auto;height:44vh}
    .dock{gap:8px;padding:8px}
    .export span{display:none}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<aside class="panel">
  <div class="tabs" role="tablist">
    <button class="tab" id="tabAssets" role="tab" aria-selected="true">
      <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Assets
    </button>
    <button class="tab" id="tabEditor" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
      Editor
    </button>
  </div>

  <div class="search" id="searchWrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="text" placeholder="Search" spellcheck="false" autocomplete="off">
  </div>

  <div class="body" id="body"></div>
</aside>

<div class="dock">
  <button class="ico" id="btMenu" title="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <button class="ico" id="btPlay" title="Play/pause">
    <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <button class="pal" id="btPal" title="Paleta">
    <span class="dots" id="palDots"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
  </button>
  <span class="sep"></span>
  <button class="export" id="btExport">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
    <span>Exportar</span>
  </button>
</div>

<div class="pop" id="popPal">
  <h3>Palette colors:</h3>
  <div class="swatches" id="palSwatches"></div>
  <div class="ramp" id="palRamp"></div>
</div>

<div class="pop menu" id="popMenu"></div>

<script>
/* ==================================================================== *
 *  Gerador — uma página só.
 *
 *  Os dois motores vivem em IIFEs separadas e são cópias verbatim do que
 *  rodava em cada página antiga: mesma geometria, mesmas correções. Cada
 *  um expõe o adaptador descrito abaixo, e a casca não sabe nada de dentro
 *  deles — nem quantos templates existem, nem o que cada controle faz.
 *
 *  ------------------------------------------------------------------
 *  O CONTRATO DO ADAPTADOR
 *  ------------------------------------------------------------------
 *  Um motor novo entra na aplicação implementando isto. Nada além disso
 *  é olhado pela casca, e `test.html` verifica o contrato inteiro — a
 *  constante CONTRATO de lá é esta lista em forma executável.
 *
 *  IDENTIDADE
 *    id            string curta que nomeia o grupo na aba Assets ('2d')
 *
 *  TEMPLATES
 *    layouts()     -> [{ key, name }] tudo que o motor sabe desenhar
 *    layout()      -> key do template ativo
 *    setLayout(k)  troca o template. ATENÇÃO: reaplica o preset dele, ou
 *                  seja, descarta os ajustes do usuário. Quem só quer
 *                  espiar um template tem de usar snapshot/restore em
 *                  volta — foi esse detalhe que fez a busca da aba Assets
 *                  apagar silenciosamente os ajustes de quem digitava.
 *
 *  DESENHO
 *    draw(ctx,W,H) pinta o quadro inteiro, fundo incluído. Não pode
 *                  deixar pixel transparente: a casca nunca limpa o
 *                  canvas antes.
 *    advance(dt)   -> bool: avança o tempo e responde SE ALGO MUDOU.
 *                  Responder true à toa custa um repaint por quadro para
 *                  sempre; responder false quando mudou congela a tela.
 *
 *  CONTROLES  (a casca monta a UI a partir do que vier, sem interpretar)
 *    controls()    -> [{ key, label, min, max, value, suffix }] do card Forma
 *    motion()      -> idem, do card Movimento
 *    set(k,v)      escreve um controle
 *    get(k)        -> valor atual. set/get têm de concordar
 *
 *  ESTADO
 *    snapshot()    -> objeto opaco com o estado inteiro
 *    restore(o)    devolve exatamente aquele estado. O par precisa fechar:
 *                  restore(snapshot()) não pode mudar nada
 *    seed()        -> semente atual, para exibição
 *    reseed()      sorteia outra
 *
 *  CORES
 *    palettes()    -> [{ key, name, bg, ink, bands }]
 *    palette()     -> key da paleta ativa      setPalette(k)
 *    accent()      -> cor de acento em hex     setAccent(c)
 *
 *  SAÍDA
 *    formats()     -> [{ key, a }] com a razão de aspecto
 *    format()      -> key do formato ativo     setFormat(k)
 *    exportPNG()   baixa o PNG
 *
 *  ------------------------------------------------------------------
 *  OPCIONAIS — a casca detecta por CAPACIDADE, nunca por identidade do
 *  motor: se o método existe, o controle aparece.
 *  ------------------------------------------------------------------
 *    dirs()/setDir(d)      quatro direções discretas, viram botões
 *    modes()/setMode(m)    lista de animações, vira um select
 *    toggles()/toggle(k)   liga-desliga, viram botões de estado
 *    camera()              controles extras, ganham um card próprio
 *    orbit(dx,dy)          arrastar no canvas passa a orbitar
 *    zoomBy(d)             a roda do mouse passa a dar zoom
 *    exportSVG()           acrescenta o item no menu
 *    exportWebM(), hasVideo  idem, para vídeo
 *    drawGuide(ctx,W,H)    pinta por cima da cena o recorte que o export
 *                          aplica. Nunca entra no arquivo exportado
 *    video()/setVideo(k,v) controles de duração, fps, ciclos e frame,
 *                          num card próprio
 *    useCanvas(c)          recebe o canvas do palco, se precisar dele
 * ==================================================================== */

/* ---------------------------- motor 2D ---------------------------- */
const ENG2D = (() => {
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const newSeed = () => Math.random().toString(36).slice(2, 8).toUpperCase();

/* ---------- paletas: bg = fundo, ink = acento ---------- */
const PALETTES = {
  bloom:     { name:'Bloom',     bg:'#3d3d3d', ink:'#e879f9',
               bands:['#e879f9','#3d3d3d','#f9a8f5','#4a4a4a','#c98cff','#333333'] },
  stack:     { name:'Stack',     bg:'#f2f2f0', ink:'#f48024',
               bands:['#f48024','#f2f2f0','#0c0d0e','#c9ccce','#ffb066','#e6e3db'] },
  ink:       { name:'Ink',       bg:'#0c0d0e', ink:'#f2f2f0',
               bands:['#f2f2f0','#0c0d0e','#9aa0a3','#1c1d1e','#d8d8d3','#2b2c2d'] },
  ember:     { name:'Ember',     bg:'#1b0f04', ink:'#ffc300',
               bands:['#ffc300','#1b0f04','#ff5a1f','#3a1c06','#ffb066','#2a1405'] },
  blueprint: { name:'Blueprint', bg:'#0a2540', ink:'#7de2ff',
               bands:['#7de2ff','#0a2540','#4361ff','#134a78','#c3b9ff','#0e3358'] },
  paper:     { name:'Paper',     bg:'#e6e2d6', ink:'#c8492b',
               bands:['#c8492b','#e6e2d6','#1f1c17','#a89b7d','#4f6b52','#d8d2c2'] },
  noir:      { name:'Noir',      bg:'#f4f4f2', ink:'#141414',
               bands:['#141414','#f4f4f2','#3d3d3d','#d8d8d3','#6b6b64','#ffffff'] },
  volt:      { name:'Volt',      bg:'#0d0d0d', ink:'#ccff00',
               bands:['#ccff00','#0d0d0d','#a3cc00','#1c1c1c','#e8ff7a','#2b2b2b'] }
};

/* ---------- formatos ---------- */
const FORMATS = {
  wide:   { a: 16 / 9, w: 1920 },
  square: { a: 1,      w: 1600 },
  tall:   { a: 9 / 16, w: 1080 },
  post:   { a: 4 / 5,  w: 1440 },
  banner: { a: 3,      w: 2400 }
};

/* ---------- layouts ---------- *
 * Os dois sistemas partem da mesma ideia: uma fila de fronteiras que divide
 * o quadro em faixas de cor chapada. No Arc Bands a fronteira e um arco; no
 * Barcode e um corte reto, e o que varia e a proporcao tinta/papel.
 * Cada layout renomeia e re-escala os controles que compartilha.        */
const LAYOUTS = {
  arcs: {
    name: 'Arc Bands',
    labels: { count:'Peças', radius:'Raio', decay:'Progressão', step:'Abertura',
              start:'Achatamento', angle:'Ângulo', origin:'Variação' },
    ranges: { count:[2,14], radius:[20,140], decay:[40,160], step:[0,60],
              start:[20,200], origin:[0,100] },
    uses: ['count','radius','decay','step','start','angle','origin'],
    modes: ['slide','accordion','pulse','spin','off']
  },
  cadence: {
    name: 'Cadence',
    labels: { count:'Linhas', step:'Blocos', radius:'Espessura', decay:'Progressão',
              start:'Ritmo', origin:'Variação' },
    ranges: { count:[2,14], step:[2,40], radius:[10,90], decay:[40,140],
              start:[0,100], origin:[0,100] },
    uses: ['count','step','radius','decay','start','origin','dir'],
    modes: ['run','pulse','off']
  },
  bars: {
    name: 'Barcode',
    labels: { count:'Barras', radius:'Tinta', decay:'Progressão', origin:'Variação' },
    ranges: { count:[3,48], radius:[5,95], decay:[40,140], origin:[0,100] },
    uses: ['count','radius','decay','origin','dir'],
    modes: ['fall','march','pulse','accordion','off']
  }
};

/* direções discretas do Barcode: a fila anda no +x do referencial girado,
   então o giro define para onde ela caminha */
const DIRS = { right: 0, down: 90, left: 180, up: 270 };
const DIR_LABELS = { left: '←  esquerda', right: '→  direita', up: '↑  cima', down: '↓  baixo' };

const MODE_LABELS = {
  run:       'Correr — cada linha no seu tempo',
  fall:      'Caindo — as barras se soltam do apoio',
  march:     'Andar — a fila atravessa a tela',
  slide:     'Deslizar — a fila vai e volta',
  accordion: 'Sanfona — os pesos abrem e fecham',
  pulse:     'Pulsar — respira',
  spin:      'Girar — a direção roda',
  off:       'Estático'
};

/* faixas padrao dos sliders, para os controles que o layout nao redefine */
const DEFAULT_RANGES = { count:[2,24], radius:[20,300], decay:[40,160], step:[-20,60],
                         start:[-40,130], angle:[-180,180], origin:[0,100] };

/* ---------- estado ---------- */
const S = {
  layout: 'arcs',
  count: 6, radius: 118, decay: 96, step: 12, start: 58, angle: 0, dir: 'left', origin: 50,
  format: 'wide', mode: 'slide', amount: 45, speed: 20,
  palette: 'bloom', multi: false,
  seed: newSeed(), frozen: false, phase: 0
};

const uses = k => LAYOUTS[S.layout].uses.includes(k);
const spinAngle = () => S.layout === 'bars' ? DIRS[S.dir] : S.angle;

const pal = () => PALETTES[S.palette];

/* jitter por semente: quebra a regularidade da fila sem sair do sistema */
function jitters(){
  const rng = mulberry32(hashStr(S.seed));
  // 64 entradas: tem de cobrir a maior contagem de qualquer layout (Barras
  // chega a 48), porque o modo Caindo indexa por i % n para manter o período
  // do padrão igual a n — e com isso o loop fecha.
  return Array.from({ length: 64 }, () => ({ r: .9 + rng() * .2, o: (rng() - .5) * .7 }));
}
let JIT = jitters();

/* ---------- geometria: variantes de uma elipse ---------- *
 * Ha uma elipse principal. Cada peca e ela mesma, cortada por uma corda
 * horizontal cada vez mais baixa: a primeira e a elipse inteira, e as
 * seguintes sao calotas cada vez mais rasas. As pecas sao empilhadas pela
 * propria altura, entao a pilha nunca se sobrepoe, qualquer que seja a
 * progressao.
 * `c` e a altura da corda no eixo menor, de -1 (elipse inteira) a +1 (nada). */
function arcList(W, H){
  const n = S.count, J = JIT, p = S.phase;
  const amt = S.amount / 100;
  const base = Math.min(W, H);

  const pulse     = S.mode === 'pulse'     ? 1 + .18 * amt * Math.sin(p) : 1;
  const accordion = S.mode === 'accordion' ? 1 + 1.4 * amt * Math.sin(p) : 1;
  const slide     = S.mode === 'slide'     ? .55 * amt * Math.sin(p) : 0;

  const a = S.radius / 100 * base * .5 * pulse;          // semieixo maior
  const b = a * (S.start / 100);                         // achatamento
  const prog = S.decay / 100;
  const gap = S.step / 100 * base * .12 * accordion;
  const vary = S.origin / 100;

  // corda de cada peca: comeca na elipse inteira e sobe conforme a progressao
  const pecas = [];
  let alturaTotal = 0;
  for (let k = 0; k < n; k++){
    const j = J[k % J.length];
    const t = n === 1 ? 0 : k / (n - 1);
    let c = -1 + 2 * Math.pow(t, prog) + slide + j.o * vary * .3;
    c = clamp(c, -1, .985);
    const alt = b * (1 - c);                             // altura da calota
    pecas.push({ c, alt, fill: S.multi ? pal().bands[k % pal().bands.length] : pal().ink });
    alturaTotal += alt;
  }
  alturaTotal += gap * (n - 1);

  let y = -alturaTotal / 2;
  for (const pc of pecas){
    pc.a = a;
    pc.b = b;
    pc.cy = y + pc.alt - b;                              // centro da elipse da peca
    y += pc.alt + gap;
  }
  return pecas;
}

/* ---------- geometria: as barras ---------- *
 * Cada celula tem um peso e uma proporcao de tinta. A proporcao cai de forma
 * geometrica ao longo da fila: densa de um lado, rarefeita do outro. Os pesos
 * sao normalizados no fim, entao a fila sempre preenche o quadro por inteiro,
 * qualquer que seja a contagem ou o jitter.                              */
function barList(W, H){
  const n = S.count, J = JIT;
  const amt = S.amount / 100, p = S.phase;
  const duty0 = clamp(S.radius / 100, .02, .98);
  const fall = S.decay / 100;
  const vary = S.origin / 100;
  // As direções do Barcode são axiais, então o vão da fila é exatamente a
  // dimensão do quadro naquela direção — não a diagonal. É o que garante que
  // a barra de apoio caia dentro do quadro e que `Barras` signifique de fato
  // o número de barras atravessando a tela.
  const L = (S.dir === 'up' || S.dir === 'down') ? H : W;
  const cor = i => S.multi ? pal().bands[(i % n) % pal().bands.length] : pal().ink;

  if (S.mode === 'fall'){
    // A barra de apoio nao sai do lugar; as outras se soltam dela e afinam.
    // A diferenca em relacao a marcha e de onde vem a largura: aqui ela e
    // funcao da DISTANCIA ate o apoio, nao da barra. Entao a barra afina
    // enquanto se afasta, e nao carrega a propria espessura.
    // Em frac = 1 cada barra assume o lugar (e a espessura) da anterior:
    // a imagem se repete e o loop fecha.
    const frac = (p / TAU) % 1;
    const base = L / n;                               // passo constante: queda uniforme
    const jit = u => {                                // jitter interpolado: continuo
      const i = Math.floor(u), t = u - i;
      const a = J[i % n].r - 1, b = J[(i + 1) % n].r - 1;
      return 1 + (a * (1 - t) + b * t) * vary * 1.6;
    };
    const bar = u => {
      const duty = clamp(duty0 * Math.pow(fall, u) * jit(u), .01, .99);
      // piso de meio pixel: com contagem alta e progressão forte a cauda
      // ficaria sub-pixel e o quadro pareceria vazio
      return { x: -L / 2 + base * u, w: Math.max(base * duty, .6), fill: cor(Math.round(u)) };
    };
    const out = [bar(0)];                             // o apoio
    for (let i = 0; i < n; i++) out.push(bar(i + frac));
    return out;
  }

  const pulse = S.mode === 'pulse'     ? 1 + .5 * amt * Math.sin(p) : 1;
  const acc   = S.mode === 'accordion' ? amt : 0;

  // Padrão PERIÓDICO de n células. Como o índice absoluto entra por k % n,
  // rolar exatamente um período devolve a mesma imagem: a marcha fecha em
  // loop. Com Progressão em 100% não existe degrau entre um período e o
  // seguinte, e a fila anda sem costura nenhuma.
  const cells = [];
  let period = 0;
  for (let i = 0; i < n; i++){
    const j = J[i % J.length];
    const duty = clamp(duty0 * pulse * Math.pow(fall, i), .02, .98);
    const w = Math.max(.08, 1 + (j.r - 1) * vary * 4 + acc * .6 * Math.sin(p + i * .8));
    cells.push({ w, duty });
    period += w;
  }

  const scale = L / period;            // um período preenche a diagonal
  const periodPx = period * scale;
  const march = S.mode === 'march' ? (p / TAU * periodPx) % periodPx : 0;

  const out = [];
  let x = -L / 2 - periodPx + march;   // começa um período atrás da borda
  let k = 0;
  while (x < L / 2){
    const c = cells[k % n];
    const w = c.w * scale;
    if (x + w > -L / 2) out.push({ x, w: Math.max(w * c.duty, .6), fill: cor(k) });
    x += w;
    k++;
  }
  return out;
}

/* ---------- geometria: as linhas do Cadence ---------- *
 * Cada linha e um compasso proprio: sua propria contagem de blocos e sua
 * propria velocidade. Como o padrao de uma linha se repete a cada celula, e
 * cada linha avanca um numero INTEIRO de celulas por ciclo, todas voltam ao
 * lugar ao mesmo tempo — o loop fecha por construcao, mesmo com as linhas
 * andando em velocidades diferentes.                                     */
function cadenceList(W, H){
  const rows = S.count, J = JIT, p = S.phase;
  const blocks0 = S.step;
  const duty = clamp(S.radius / 100, .05, .95);
  const prog = S.decay / 100;
  const spread = S.start / 100;
  const vary = S.origin / 100;
  const amt = S.amount / 100;

  const vertical = S.dir === 'up' || S.dir === 'down';
  const along = vertical ? H : W;      // eixo em que a linha corre
  const across = vertical ? W : H;     // eixo em que as linhas se empilham
  const sign = (S.dir === 'left' || S.dir === 'up') ? -1 : 1;
  const pulse = S.mode === 'pulse' ? 1 + .45 * amt * Math.sin(p) : 1;

  const out = [];
  for (let r = 0; r < rows; r++){
    const j = J[r % J.length];
    const nb = Math.max(1, Math.round(blocks0 * Math.pow(prog, r) * (1 + (j.r - 1) * vary * 3)));
    const cell = along / nb;
    const w = clamp(duty * pulse * (1 + (j.o) * vary), .05, .95) * cell;
    const m = 1 + Math.round(spread * 6 * r);            // voltas inteiras por ciclo
    const off = S.mode === 'run' ? (sign * (p / TAU) * m * cell) % cell : 0;
    const y0 = -across / 2 + across * r / rows;
    const y1 = -across / 2 + across * (r + 1) / rows;
    const fill = S.multi ? pal().bands[r % pal().bands.length] : pal().ink;
    for (let i = -1; i <= nb; i++)
      out.push({ x: -along / 2 + i * cell + off, w, y0, y1, fill });
  }
  return out;
}

/* Registro das geometrias. Serve de trava: se uma funcao sumir num refactor,
   o arquivo quebra aqui no carregamento, com o nome do layout, em vez de

/* ---------- desenho ---------- */
function drawScene(ctx, W, H){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = pal().bg;
  ctx.fillRect(0, 0, W, H);
  const M = Math.hypot(W, H) * 2;
  // Cadence e Barcode sao axiais, entao as bordas podem cair em pixel inteiro.
  // Sem isso a cobertura parcial mistura tinta e fundo e deixa um fio claro na
  // divisa — o que parece um stroke, mas e antialiasing.
  //
  // A LARGURA da barra e arredondada sozinha, e nao como round(x+w)-round(x):
  // essa diferenca depende da parte fracionaria de x, entao a barra mudava de
  // espessura sozinha enquanto a fila rastejava — a linha inteira piscava.
  // Barras vizinhas nao se encostam (ha papel entre elas), entao arredondar a
  // largura nao abre fresta. Ja as LINHAS do Cadence se encostam, e por isso
  // as bordas horizontais continuam arredondadas aos pares.
  const axial = S.layout === 'cadence' || S.layout === 'bars';
  const R = v => Math.round(v);
  const Rw = v => Math.max(1, Math.round(v));
  ctx.save();
  ctx.translate(axial ? R(W / 2) : W / 2, axial ? R(H / 2) : H / 2);
  ctx.rotate(spinAngle() * DEG);
  if (S.layout === 'cadence'){
    for (const b of cadenceList(W, H)){
      ctx.fillStyle = b.fill;
      ctx.fillRect(R(b.x), R(b.y0), Rw(b.w), Math.max(1, R(b.y1) - R(b.y0)));
    }
  } else if (S.layout === 'bars'){
    for (const b of barList(W, H)){
      ctx.fillStyle = b.fill;
      ctx.fillRect(R(b.x), -M / 2, Rw(b.w), M);
    }
  } else {
    // calota: percorre o arco de baixo, de uma ponta da corda a outra, e fecha
    for (const pc of arcList(W, H)){
      const t0 = Math.asin(clamp(pc.c, -1, 1));
      ctx.beginPath();
      ctx.ellipse(0, pc.cy, pc.a, pc.b, 0, t0, Math.PI - t0, false);
      ctx.closePath();
      ctx.fillStyle = pc.fill;
      ctx.fill();
    }
  }
  ctx.restore();
}

const PRESETS = {
  arcs: { count:6,  radius:96,  decay:130, step:14, start:52, angle:0, origin:20, palette:'noir', mode:'accordion', amount:45 },
  bars: { count:10, radius:95,  decay:68, step:12, start:58, angle:0,  dir:'down', origin:35, palette:'noir', mode:'fall', amount:35 },

function download(url, name, revoke){
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  if (revoke) setTimeout(() => URL.revokeObjectURL(url), 6000);
}
function expDims(scale){
  const f = FORMATS[S.format];
  const W = Math.round(f.w * scale);
  return { W, H: Math.round(W / f.a) };
}
function exportPNG(scale){
  const { W, H } = expDims(scale);
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  drawScene(off.getContext('2d'), W, H);
  download(off.toDataURL('image/png'), 'arcs-' + S.seed + '-' + S.format + '@' + scale + 'x.png');
}
function exportSVG(){
  const { W, H } = expDims(1);
  const n = v => Math.round(v * 100) / 100;
  const M = Math.round(Math.hypot(W, H) * 2);
  const out = [
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">',
    '<rect width="' + W + '" height="' + H + '" fill="' + pal().bg + '"/>',
    '<g transform="translate(' + n(W / 2) + ' ' + n(H / 2) + ') rotate(' + spinAngle() + ')">'
  ];
  // mesma primitiva e mesma ordem de pintura do canvas
  const R = v => Math.round(v);
  const Rw = v => Math.max(1, Math.round(v));
  if (S.layout === 'cadence'){
    for (const b of cadenceList(W, H))
      out.push('<rect x="' + R(b.x) + '" y="' + R(b.y0) + '" width="' + Rw(b.w) +
               '" height="' + Math.max(1, R(b.y1) - R(b.y0)) + '" fill="' + b.fill + '"/>');
  } else if (S.layout === 'bars'){
    for (const b of barList(W, H))
      out.push('<rect x="' + R(b.x) + '" y="' + n(-M / 2) + '" width="' + Rw(b.w) +
               '" height="' + M + '" fill="' + b.fill + '"/>');
  } else {
    for (const pc of arcList(W, H)){
      const t0 = Math.asin(clamp(pc.c, -1, 1));
      if (pc.c <= -0.999){
        out.push('<ellipse cx="0" cy="' + n(pc.cy) + '" rx="' + n(pc.a) + '" ry="' + n(pc.b) + '" fill="' + pc.fill + '"/>');
        continue;
      }
      const x0 = n(pc.a * Math.cos(t0)), y0 = n(pc.cy + pc.b * Math.sin(t0));
      const grande = Math.PI - 2 * t0 > Math.PI ? 1 : 0;
      out.push('<path d="M' + x0 + ' ' + y0 + 'A' + n(pc.a) + ' ' + n(pc.b) + ' 0 ' + grande + ' 1 ' +
               n(-pc.a * Math.cos(t0)) + ' ' + y0 + 'Z" fill="' + pc.fill + '"/>');
    }
  }
  out.push('</g>');
  out.push('</svg>');
  const url = URL.createObjectURL(new Blob([out.join('\n')], { type: 'image/svg+xml' }));
  download(url, 'arcs-' + S.seed + '-' + S.format + '.svg', true);
}

  /* adaptador: o que a casca precisa saber */
  const CONTROLS = {
    count:  { label: 'Contagem' }, radius: { label: 'Raio' },
    decay:  { label: 'Progressão' }, step: { label: 'Passo' },
    start:  { label: 'Início' }, angle: { label: 'Ângulo', suffix: '°' },
    origin: { label: 'Origem' }, amount: { label: 'Intensidade', suffix: '%' },
    speed:  { label: 'Ritmo' }
  };
  return {
    id: '2d',
    layouts: () => Object.entries(LAYOUTS).map(([k, l]) => ({ key: k, name: l.name })),
    layout: () => S.layout,
    setLayout: k => { S.layout = k; Object.assign(S, PRESETS[k]); },
    draw: (ctx, W, H) => drawScene(ctx, W, H),
    controls(){
      const L = LAYOUTS[S.layout];
      const out = [];
      for (const k of ['count','radius','decay','step','start','angle','origin']){
        if (!L.uses.includes(k)) continue;
        const rg = (L.ranges && L.ranges[k]) || DEFAULT_RANGES[k];
        out.push({ key:k, label:(L.labels && L.labels[k]) || CONTROLS[k].label,
                   min:rg[0], max:rg[1], value:S[k], suffix:CONTROLS[k].suffix || '' });
      }
      return out;
    },
    dirs: () => LAYOUTS[S.layout].uses.includes('dir')
      ? { value: S.dir, options: [['left','←'],['right','→'],['up','↑'],['down','↓']] } : null,
    setDir: d => { S.dir = d; },
    modes: () => ({ value: S.mode, options: LAYOUTS[S.layout].modes.map(m => [m, MODE_LABELS[m]]) }),
    setMode: m => { S.mode = m; },
    motion: () => [
      { key:'amount', label:'Intensidade', min:0, max:100, value:S.amount, suffix:'%' },
      { key:'speed',  label:'Ritmo',       min:1, max:80,  value:S.speed,  suffix:'' }
    ],
    set: (k, v) => { S[k] = v; },
    get: k => S[k],
    palettes: () => Object.entries(PALETTES).map(([k, p]) => ({ key:k, name:p.name, bg:p.bg, ink:p.ink, bands:p.bands })),
    palette: () => S.palette,
    setPalette: k => { S.palette = k; },
    seed: () => S.seed,
    reseed: () => { S.seed = newSeed(); JIT = jitters(); },
    // devolve se a cena mudou: em 'off' nada anda e o quadro pode ser pulado
    advance: dt => {
      if (S.mode === 'off') return false;
      S.phase += dt / 1000 * (S.speed / 100) * 1.6;
      if (S.mode === 'spin' && S.layout !== 'bars')
        S.angle = ((S.angle + dt / 1000 * (S.speed / 100) * 24 + 180) % 360) - 180;
      return true;
    },
    snapshot: () => Object.assign({}, S),
    restore: o => Object.assign(S, o),
    accent: () => PALETTES[S.palette].ink,
    setAccent: c => { PALETTES[S.palette].ink = c; },
    formats: () => Object.entries(FORMATS).map(([k, f]) => ({ key:k, a:f.a })),
    format: () => S.format,
    setFormat: k => { S.format = k; },
    // o motor 2D exporta por escala; sem um padrao aqui o canvas sai 0x0
    exportPNG: (scale = 2) => exportPNG(scale),
    exportSVG,
    hasVideo: false
  };
})();

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const newSeed = () => Math.random().toString(36).slice(2, 7).toUpperCase();

function shade(hex, f){
  if (f >= .999) return hex;
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${Math.round(((n >> 16) & 255) * f)},${Math.round(((n >> 8) & 255) * f)},${Math.round((n & 255) * f)})`;
}
/* interpola duas cores hex (0 = a, 1 = b) e devolve hex */
function mix(a, b, t){
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const r = Math.round(((A >> 16) & 255) * (1 - t) + ((B >> 16) & 255) * t);
  const g = Math.round(((A >> 8) & 255) * (1 - t) + ((B >> 8) & 255) * t);
  const c = Math.round((A & 255) * (1 - t) + (B & 255) * t);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + c).toString(16).slice(1);
}

/* mono: base + fundo + direção dos degraus tonais.
   String = atalho para "degraus na direção do próprio fundo" (recuo natural).
   Objeto = fundo e direção explícitos, para casos como preto-sobre-preto,
   em que recuar na direção do fundo apagaria a peça inteira. */
function monoSpec(p){
  const m = p.mono;
  if (typeof m === 'string') return { base:m, bg:p.bg, to:p.bg };
  return { base:m.base, bg:m.bg || p.bg, to:m.to || m.bg || p.bg };
}

/* papéis efetivos: policromático, ou rampa tonal quando mono está ligado */
function roles(i = S.palette){
  const p = PALETTES[i];
  if (!S.mono) return p;
  const m = monoSpec(p);
  const t = f => mix(m.base, m.to, f);
  return { bg:m.bg, top:m.base, a:t(.27), b:t(.5), core:t(.4), end:t(.38),
           bands:[0, .12, .26, .4, .54, .66].map(t) };
}

/* ---------- geometria ---------- */
function ccw(pts){
  let a = 0;
  for (let i = 0; i < pts.length; i++){
    const j = (i + 1) % pts.length;
    a += pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1];
  }
  return a >= 0 ? pts : pts.slice().reverse();
}
const rect = (x0, y0, x1, y1) => ccw([[x0,y0],[x1,y0],[x1,y1],[x0,y1]]);
function rotPts(pts, a){
  const c = Math.cos(a), s = Math.sin(a);
  return pts.map(([x, y]) => [x * c - y * s, x * s + y * c]);
}

function topColor(seed01){
  const p = RO;
  if (!S.bands) return p.top;
  return p.bands[Math.floor(seed01 * p.bands.length) % p.bands.length];
}

/* peça = { pts, z0, z1, top } */
/* Zigurate: placas maciças, cada uma apoiada no topo da anterior.
   Empilhar (em vez de partir todas do chão) garante que nenhum trecho de
   degrau fique enterrado dentro da placa de baixo — o que pintaria faixas
   escuras sobre o terraço — e que a escada sempre suba.

   Wave aqui GIRA os níveis: o Effector abre a torção estática entre eles
   (o pinwheel) e a fase faz cada nível girar continuamente. O incremento
   é de quartos de volta por ciclo, múltiplo da simetria do quadrado, para
   o WebM continuar fechando em loop perfeito. */
function piecesPyramid(){
  const L = S.count, out = [];
  const step = 1 / L;
  const shrink = step * (.6 + (S.gap / 100) * .8);   // recuo de cada nível
  const riser = (S.height / 100) / L;                // altura de cada degrau
  const twist = S.wave ? (S.effector / 100) * TAU * .18 : 0;
  let z = 0;
  for (let k = 0; k < L; k++){
    const o = 1 - k * shrink;
    if (o <= .03) break;
    const ang = twist * (k / Math.max(1, L - 1)) + (S.wave ? S.phase * .25 * k : 0);
    out.push({
      pts: ccw(rotPts([[-o,-o],[o,-o],[o,o],[-o,o]], ang)),
      z0: z, z1: z + riser,
      top: topColor((k + .5) / L)
    });
    z += riser;
  }
  return out;
}

function piecesTwist(){
  const N = S.count, out = [];
  const thick = (S.height / 100) * 1.7 / N;
  const g = (S.gap / 100) * thick * .7;
  for (let k = 0; k < N; k++){
    const t = k / N;
    const mod = S.wave ? Math.abs(Math.sin(t * Math.PI * S.lobes * .5 + S.phase)) : 1;
    const s = .62 * (.5 + .5 * mod);
    const ang = (S.effector / 100) * t * TAU * .75 + S.phase * .25;
    out.push({
      pts: ccw(rotPts([[-s,-s],[s,-s],[s,s],[-s,s]], ang)),
      z0: k * thick, z1: k * thick + thick - g,
      top: topColor(t)
    });
  }
  return out;
}

function piecesStack(){
  const N = S.count, out = [];
  const cell = 2 / N;
  const g = (S.gap / 100) * cell * .6;
  for (let iy = 0; iy < N; iy++){
    for (let ix = 0; ix < N; ix++){
      const x0 = -1 + ix * cell + g / 2, y0 = -1 + iy * cell + g / 2;
      const cx = x0 + (cell - g) / 2, cy = y0 + (cell - g) / 2;
      const r = Math.hypot(cx, cy) / Math.SQRT2;
      const k = 1 + (S.wave ? S.effector / 100 : 0) * Math.sin(r * Math.PI * S.lobes - S.phase);
      out.push({
        pts: rect(x0, y0, x0 + cell - g, y0 + cell - g),
        z0: 0, z1: Math.max(.02, (S.height / 100) * .55 * k),
        top: topColor(r)
      });
    }
  }
  return out;
}

/* Tower: fatias iguais empilhadas com folga entre elas. A folga é o que
   revela uma listra do topo da placa de baixo — a listra fina que aparece
   entre as laterais. Effector desloca as placas lateralmente (baralho
   desalinhado); em 0 é uma coluna perfeitamente reta. */
function piecesTower(){
  const N = S.count, out = [];
  const total = (S.height / 100) * 2.6;
  const pitch = total / N;
  const g = (S.gap / 100) * pitch * .6;
  const thick = Math.max(pitch * .12, pitch - g);
  const amp = (S.wave ? S.effector / 100 : 0) * .9;
  for (let k = 0; k < N; k++){
    const t = k / Math.max(1, N - 1);
    const ph = t * Math.PI * S.lobes + S.phase;
    const dx = amp * Math.sin(ph), dy = amp * Math.cos(ph) * .5;
    out.push({
      pts: rect(-1 + dx, -1 + dy, 1 + dx, 1 + dy),
      z0: k * pitch, z1: k * pitch + thick,
      top: topColor(t)
    });
  }
  return out;
}

function piecesCircle(){
  const N = S.count, out = [];
  const half = (TAU / N) * (1 - S.gap / 100) / 2;
  const r0 = S.inner / 100;
  const low = clamp(1 - S.effector / 100, .06, 1);
  for (let i = 0; i < N; i++){
    const a = i / N * TAU;
    // O Wave modula a ALTURA, não o comprimento: todas as pontas ficam na
    // mesma circunferência e o que muda é a extrusão. Onda triangular — sobe e
    // desce linearmente, do maior ao menor, sem o salto do dente de serra.
    const u = (i / N * S.lobes + S.phase / TAU) % 1;
    const tri = 1 - Math.abs(2 * u - 1);
    const k = S.wave ? low + (1 - low) * tri : 1;
    const r1 = 1.4;
    const armH = Math.max(.03, (S.height / 100) * k);
    const span = r1 - r0;
    for (let j = 0; j < S.segments; j++){
      const ra = r0 + span * (j / S.segments);
      const rb = r0 + span * ((j + 1) / S.segments);
      const P = (r, ang) => [r * Math.cos(ang), r * Math.sin(ang)];
      out.push({
        pts: ccw([P(ra, a - half), P(rb, a - half), P(rb, a + half), P(ra, a + half)]),
        z0: 0, z1: armH * (.45 + .55 * (j + 1) / S.segments),
        top: topColor(i / N), roles: ['a', 'end', 'b', 'in']
      });
    }
  }
  // Miolo: disco limpo em repouso; deforma junto com o Wave. A altura acompanha
  // o braço mais alto, para esconder as pontas internas das pétalas.
  const cRng = mulberry32(hashStr(S.seed + 'core'));
  const wob = S.wave ? (S.effector / 100) : 0;
  const M = 48, core = [];
  for (let i = 0; i < M; i++){
    const a = i / M * TAU;
    const r = r0 * (1.02 + wob * (.10 * Math.sin(a * 3 + S.phase) + .035 * cRng()));
    core.push([r * Math.cos(a), r * Math.sin(a)]);
  }
  // flat: a parede do miolo usa a cor dele, para ler como um volume único
  out.push({ pts: ccw(core), z0:0, z1: Math.max(.05, S.height / 100),
             top: RO.core || RO.bands[4], flat: true });
  return out;
}

const BUILDERS = { pyramid:piecesPyramid, twist:piecesTwist, stack:piecesStack,
                   tower:piecesTower, circle:piecesCircle };

/* ---------- projeção ---------- */
let view = { scale:1, cx:0, cy:0 };

function raw(x, y, z){
  const ca = Math.cos(S.rot), sa = Math.sin(S.rot);
  const rx = x * ca - y * sa, ry = x * sa + y * ca;
  const se = Math.sin(S.elev * DEG), ce = Math.cos(S.elev * DEG);
  return { x: rx, y: ry * se - z * ce, d: ry * ce + z * se };
}
const project = (x, y, z) => {
  const r = raw(x, y, z);
  return { x: view.cx + r.x * view.scale, y: view.cy + r.y * view.scale, d: r.d };
};

/* Enquadramento estável: bbox projetada amostrada ao longo do ciclo (e do giro,
   quando Rotate está ligado), para a moldura não "respirar" durante a animação. */
let FRAME = { minx:-1, maxx:1, miny:-1, maxy:1 };

function computeFrame(){
  const savedP = S.phase, savedR = S.rot;
  const phases = [0, .2, .4, .6, .8].map(u => u * TAU * S.cycles);
  const spins = S.rotate ? [0, .25, .5, .75].map(u => u * TAU) : [0];
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  for (const dp of phases){
    S.phase = savedP + dp;
    const pieces = BUILDERS[S.layout]();
    for (const ds of spins){
      S.rot = savedR + ds;
      for (const p of pieces) for (const q of p.pts) for (const z of [p.z0, p.z1]){
        const r = raw(q[0], q[1], z);
        if (r.x < minx) minx = r.x; if (r.x > maxx) maxx = r.x;
        if (r.y < miny) miny = r.y; if (r.y > maxy) maxy = r.y;
      }
    }
  }
  S.phase = savedP; S.rot = savedR;
  FRAME = { minx, maxx, miny, maxy };
}

/* view da tela: enquadramento estável + zoom + pan (pan em fração da largura) */
function viewFor(W, H){
  // zoom 100 = a cena preenche exatamente o quadro de export
  const b = cropBox(W, H);
  const w = Math.max(1e-3, FRAME.maxx - FRAME.minx);
  const h = Math.max(1e-3, FRAME.maxy - FRAME.miny);
  const s = .92 * Math.min(b.w / w, b.h / h) * (S.zoom / 100);
  return {
    scale: s,
    cx: b.x + b.w / 2 - (FRAME.minx + FRAME.maxx) / 2 * s + S.panX * W,
    cy: b.y + b.h / 2 - (FRAME.miny + FRAME.maxy) / 2 * s + S.panY * W
  };
}

/* retângulo do guia, em px do canvas */
function cropBox(W, H){
  // área livre: evita o painel, para o guia nunca ficar escondido atrás dele
  const dpr = W / Math.max(1, window.innerWidth);
  const inset = window.innerWidth > 900 ? 264 * dpr : 0;
  const AW = W - inset;
  const A = EXP_ASPECT[S.expFormat] || (AW / H);
  let w = AW * .92, h = w / A;
  if (h > H * .92){ h = H * .92; w = h * A; }
  return { x: inset + (AW - w) / 2, y: (H - h) / 2, w, h };
}

/* tamanho do arquivo exportado */
function expDims(){
  const A = EXP_ASPECT[S.expFormat] || (canvas.width / canvas.height);
  const n = +S.expSize;                     // referência = lado menor (1080 => 1920x1080 em 16:9)
  let w = A >= 1 ? Math.round(n * A) : n;
  let h = A >= 1 ? n : Math.round(n / A);
  // dimensões pares: exigência prática dos codecs de vídeo
  return { w: w + (w % 2), h: h + (h % 2) };
}

/* ---------- desenho ---------- */
function poly(ctx, pts, fill){
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = fill;   // costura: mata os fios de antialiasing entre faces
  ctx.lineWidth = 1;
  ctx.stroke();
}

/* Cor é propriedade da FACE, no espaço da própria peça: cada aresta do
   footprint tem um papel fixo. Nada aqui olha para a câmera nem para a fase,
   então nenhuma face troca de cor durante a animação — sem luz simulada.
   Sombra também é por papel (fixa), não por orientação. */
const ROLE_SHADE = { a:0, b:.45, end:.2, in:.6 };

function prismFaces(piece){
  const { pts, z0, z1, top } = piece;
  const p = RO;
  const sh = S.shadow / 100;
  const bot = pts.map(q => project(q[0], q[1], z0));
  const cap = pts.map(q => project(q[0], q[1], z1));
  const faces = [];
  for (let i = 0; i < pts.length; i++){
    const j = (i + 1) % pts.length;
    // papel da face: explícito na peça, ou alternado por aresta (opostas iguais)
    const role = piece.flat ? 'flat'
               : piece.roles ? piece.roles[i % piece.roles.length]
               : (i % 2 ? 'b' : 'a');
    const base = role === 'flat' ? top
               : role === 'end'  ? (p.end || p.a)
               : role === 'a'    ? p.a
               : p.b;
    const f = 1 - sh * (role === 'flat' ? .3 : ROLE_SHADE[role]);
    const q = [bot[i], bot[j], cap[j], cap[i]];
    faces.push({ pts:q, fill: shade(base, f), d:(q[0].d + q[1].d + q[2].d + q[3].d) / 4 });
  }
  faces.sort((m, n) => m.d - n.d);
  faces.push({ pts: cap, fill: top, d: Infinity });
  return faces;
}

function drawScene(ctx, W, H, viewOverride){
  RO = roles();
  view = viewOverride || viewFor(W, H);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = RO.bg;
  ctx.fillRect(0, 0, W, H);
  const items = BUILDERS[S.layout]().map(pc => {
    let sx = 0, sy = 0;
    for (const q of pc.pts){ sx += q[0]; sy += q[1]; }
    const c = raw(sx / pc.pts.length, sy / pc.pts.length, (pc.z0 + pc.z1) / 2);
    return { d: c.d, faces: prismFaces(pc) };
  });
  items.sort((m, n) => m.d - n.d);
  for (const it of items) for (const f of it.faces) poly(ctx, f.pts, f.fill);
}

/* render de export: usa a MESMA câmera da tela, recortada no guia */
function drawExport(ctx, W, H){
  const box = cropBox(canvas.width, canvas.height);
  const v = viewFor(canvas.width, canvas.height);
  const k = W / box.w;
  drawScene(ctx, W, H, { scale: v.scale * k, cx: (v.cx - box.x) * k, cy: (v.cy - box.y) * k });
}

function drawGuide(ctx, W, H){
  const b = cropBox(W, H);
  ctx.save();
  ctx.fillStyle = 'rgba(8,8,8,.5)';
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.rect(b.x, b.y, b.w, b.h);
  ctx.fill('evenodd');
  ctx.strokeStyle = 'rgba(255,255,255,.45)';
  ctx.lineWidth = Math.max(1, W / 1000);
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  ctx.restore();
}

const PRESETS = {
  pyramid: { count:6,  segments:2, effector:35, lobes:3, height:100, inner:30, gap:50, elev:34, bands:false },
  twist:   { count:22, segments:2, effector:60, lobes:2, height:150, inner:30, gap:12, elev:20, bands:true  },
  stack:   { count:9,  segments:2, effector:60, lobes:3, height:90,  inner:30, gap:16, elev:30, bands:false },
  tower:   { count:8,  segments:2, effector:15, lobes:2, height:145, inner:30, gap:25, elev:24, bands:false },
  circle:  { count:20, segments:1, effector:70, lobes:1, height:52,  inner:45, gap:35, elev:34, bands:false }
};

function download(url, name, revoke){
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  if (revoke) setTimeout(() => URL.revokeObjectURL(url), 8000);
}

function exportPNG(){
  const { w, h } = expDims();
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  drawExport(off.getContext('2d'), w, h);
  download(off.toDataURL('image/png'), `stacks3d-${S.layout}-${S.seed}-f${S.frame}.png`);
}

async function exportWebM(){
  const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mimeType = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!mimeType){ alert('Este navegador não suporta gravação em WebM.'); return; }

  const { w, h } = expDims();
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const octx = off.getContext('2d');
  const fps = +S.fps, total = totalFrames();

  const stream = off.captureStream(0);              // 0 = frames sob demanda
  const track = stream.getVideoTracks()[0];
  const rec = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: Math.round(w * h * fps * .12) });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const stopped = new Promise(r => { rec.onstop = r; });

  const btn = { textContent: '' };
  const savedPhase = S.phase, savedRot = S.rot, savedPlaying = S.playing;
  exporting = true;
  S.playing = false;
  

  rec.start();
  for (let f = 0; f < total; f++){
    const u = f / total;                            // 0..1 exclusivo => loop perfeito
    if (S.wave) S.phase = savedPhase + u * TAU * S.cycles;
    if (S.rotate) S.rot = savedRot + u * TAU;
    drawExport(octx, w, h);
    track.requestFrame();
    btn.textContent = `Gravando ${Math.round((f + 1) / total * 100)}%`;
    await new Promise(r => setTimeout(r, 1000 / fps));
  }
  rec.stop();
  await stopped;
  track.stop();

  S.phase = savedPhase; S.rot = savedRot; S.playing = savedPlaying;
  exporting = false;
  
  btn.textContent = 'Exportar WebM';

  const blob = new Blob(chunks, { type: mimeType });
  download(URL.createObjectURL(blob), `stacks3d-${S.layout}-${S.seed}-${w}x${h}.webm`, true);
}

  /* computeFrame reamostra a geometria em varias fases e giros — caro demais
     para rodar a cada evento de slider. Marca-se sujo e recalcula-se no maximo
     uma vez por quadro, logo antes de desenhar. */
  let frameDirty = true;
  const needFrame = () => { frameDirty = true; };

  const RANGES = {
    segments:[1,5], effector:[0,100], lobes:[1,12], height:[5,160], inner:[5,70], gap:[0,70]
  };
  const LABELS = { segments:'Segmentos', effector:'Effector', lobes:'Lóbulos',
                   height:'Altura', inner:'Miolo', gap:'Folga' };
  return {
    id: '3d',
    useCanvas: c => { canvas = c; },
    layouts: () => Object.entries(LAYOUTS).map(([k, l]) => ({ key:k, name:l.name })),
    layout: () => S.layout,
    setLayout: k => { S.layout = k; Object.assign(S, PRESETS[k]); needFrame(); },
    draw: (ctx, W, H) => { if (frameDirty){ computeFrame(); frameDirty = false; } drawScene(ctx, W, H, null); },
    controls(){
      const L = LAYOUTS[S.layout], out = [];
      if (L.uses.includes('count'))
        out.push({ key:'count', label:L.label, min:L.min, max:L.max, value:S.count, suffix:'' });
      for (const k of ['segments','effector','lobes','height','inner','gap']){
        if (!L.uses.includes(k)) continue;
        out.push({ key:k, label: k === 'gap' ? L.gapLabel : LABELS[k],
                   min:RANGES[k][0], max:RANGES[k][1], value:S[k],
                   suffix: ['height','inner','gap'].includes(k) ? '%' : '' });
      }
      return out;
    },
    camera: () => [
      { key:'elev', label:'Elevação', min:6,  max:90,  value:S.elev,   suffix:'°' },
      { key:'zoom', label:'Zoom',     min:30, max:400, value:S.zoom,   suffix:'%' },
      { key:'shadow', label:'Sombra', min:0,  max:50,  value:S.shadow, suffix:'%' }
    ],
    motion: () => [{ key:'speed', label:'Ritmo', min:1, max:200, value:S.speed, suffix:'' }],
    toggles: () => [
      { key:'rotate', label:'Rotate', value:S.rotate },
      { key:'wave',   label:'Wave',   value:S.wave },
      { key:'mono',   label:'Monocromático', value:S.mono },
      { key:'bands',  label:'Tampas em faixas', value:S.bands }
    ],
    set: (k, v) => { S[k] = v; needFrame(); },
    get: k => S[k],
    toggle: k => { S[k] = !S[k]; needFrame(); },
    palettes: () => PALETTES.map((p, i) => ({ key:i, name:p.name, bg:p.bg, ink:p.top, bands:p.bands })),
    palette: () => S.palette,
    setPalette: k => { S.palette = +k; },
    seed: () => S.seed,
    reseed: () => { S.seed = newSeed(); },
    // devolve se a cena mudou: sem Rotate nem Wave nada anda
    advance: dt => {
      if (!S.rotate && !S.wave) return false;
      const sp = S.speed / 100;
      if (S.rotate) S.rot += dt / 1000 * sp * .7;
      if (S.wave) S.phase += dt / 1000 * sp * 1.6;
      return true;
    },
    snapshot: () => Object.assign({}, S),
    restore: o => { Object.assign(S, o); needFrame(); },
    accent: () => PALETTES[S.palette].top,
    setAccent: c => { PALETTES[S.palette].top = c; },
    orbit: (dx, dy) => { S.rot += dx * .006; S.elev = clamp(S.elev - dy * .18, 6, 90); needFrame(); },
    zoomBy: d => { S.zoom = clamp(S.zoom - d * .06, 30, 400); },
    formats: () => Object.entries(EXP_ASPECT).map(([k, a]) => ({ key:k, a })),
    format: () => S.expFormat,
    setFormat: k => { S.expFormat = k; },
    exportPNG: () => exportPNG(),
    exportWebM: () => exportWebM(),
    hasVideo: true,
    // o guia mostra o recorte que o export ja aplica — sem ele o corte e invisivel
    drawGuide: (ctx, W, H) => drawGuide(ctx, W, H),
    video: () => [
      { key:'dur',    label:'Duração', min:1, max:12,  value:S.dur,    suffix:'s' },
      { key:'fps',    label:'FPS',     min:12, max:60, value:+S.fps,   suffix:'' },
      { key:'cycles', label:'Ciclos',  min:1, max:4,   value:S.cycles, suffix:'' },
      { key:'frame',  label:'Frame',   min:0, max:Math.max(1, totalFrames() - 1), value:S.frame, suffix:'' }
    ],
    setVideo: (k, v) => {
      S[k] = v;
      if (k === 'frame') S.phase = v / totalFrames() * TAU * S.cycles;   // scrub determinístico
      needFrame();
    }
  };
})();

/* ---------------------------- a casca ---------------------------- */
/* Estado no hash da URL: recarregar nao perde nada e o link e compartilhavel.
   Escrito com atraso, porque um arraste de slider dispara dezenas de eventos
   e replaceState a cada um seria desperdicio. */
let hashTimer = 0;
function escreverHash(){
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    try {
      const o = { e: APP.eng.id, s: APP.eng.snapshot() };
      const txt = btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/, '');
      history.replaceState(null, '', '#' + txt);
    } catch (e){ /* hash e conveniencia: nunca derruba a pagina */ }
  }, 300);
}
function lerHash(){
  if (location.hash.length < 2) return false;
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
    const eng = ENGINES[o.e];
    if (!eng || !o.s) return false;
    APP.eng = eng;
    eng.restore(o.s);
    return true;
  } catch (e){ return false; }
}
const $ = id => document.getElementById(id);
const stage = $('stage');
const sctx = stage.getContext('2d');
ENG3D.useCanvas(stage);

const APP = { eng: ENG2D, tab: 'assets', playing: true, busca: '', guia: false };
const ENGINES = { '2d': ENG2D, '3d': ENG3D };

/* Reconcilia o tamanho a cada quadro em vez de confiar so no evento de
   resize: se a pagina abre oculta ou sem layout, innerWidth vem 0, o canvas
   fica 0x0 e nada mais o conserta. Assim ele se cura sozinho.
   Devolve true quando o tamanho mudou — redimensionar limpa o canvas, entao
   obriga a repintar. */
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round((window.innerWidth || document.documentElement.clientWidth) * dpr));
  const h = Math.max(1, Math.round((window.innerHeight || document.documentElement.clientHeight) * dpr));
  if (stage.width === w && stage.height === h) return false;
  stage.width = w; stage.height = h;
  return true;
}

/* So se desenha quando algo muda. Parado, ou com um template estatico, o
   quadro identico deixa de ser repintado 60 vezes por segundo — o que num
   monitor 4K devolve um terco do orcamento de cada quadro. Toda mutacao de
   estado passa por invalidate(). */
let dirty = true;
const invalidate = () => { dirty = true; escreverHash(); };

let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  const cresceu = resize();
  const dt = last ? Math.min(now - last, 100) : 16;
  last = now;
  try {
    if (APP.playing && APP.eng.advance(dt)) dirty = true;
    if (dirty || cresceu){
      APP.eng.draw(sctx, stage.width, stage.height);
      if (APP.guia && APP.eng.drawGuide) APP.eng.drawGuide(sctx, stage.width, stage.height);
      dirty = false;
    }
  } catch (e){ console.error('quadro falhou:', e); }
}

/* ---------- miniaturas ---------- *
 * Desenhadas uma vez por (motor, template, paleta) e guardadas: a busca so
 * filtra, entao redesenhar tudo a cada tecla era trabalho jogado fora.
 *
 * O estado do motor e salvo e restaurado em volta do desenho. Antes daqui se
 * voltava com setLayout, que reaplica o PRESET — e isso apagava os ajustes
 * que o usuario tivesse feito no template aberto.                          */
const THUMBS = new Map();
function thumbCanvas(eng, key){
  const chave = eng.id + '/' + key + '/' + eng.palette() + '/' + eng.accent();
  let cv = THUMBS.get(chave);
  if (cv) return cv;
  cv = document.createElement('canvas');
  cv.width = 132; cv.height = 132;
  const estado = eng.snapshot();
  eng.setLayout(key);
  try { eng.draw(cv.getContext('2d'), cv.width, cv.height); } catch (e){ /* ignora */ }
  eng.restore(estado);
  THUMBS.set(chave, cv);
  return cv;
}

/* ---------- aba Assets ---------- */
function renderAssets(){
  const body = $('body');
  body.innerHTML = '';
  const q = APP.busca.trim().toLowerCase();
  let achou = 0;

  for (const [id, eng] of Object.entries(ENGINES)){
    const itens = eng.layouts().filter(l => !q || l.name.toLowerCase().includes(q) || id.includes(q));
    if (!itens.length) continue;
    achou += itens.length;

    const g = document.createElement('div');
    g.className = 'group';
    g.innerHTML =
      '<div class="ghead">' +
        '<span class="gmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">' +
        '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></span>' +
        '<span><span class="gtitle">' + id + '</span><br><span class="gsub">Templates</span></span>' +
      '</div>';
    const row = document.createElement('div');
    row.className = 'thumbs';
    for (const l of itens){
      const b = document.createElement('button');
      b.className = 'thumb';
      b.title = l.name;
      b.setAttribute('aria-pressed', String(APP.eng === eng && eng.layout() === l.key));
      b.appendChild(thumbCanvas(eng, l.key));
      b.addEventListener('click', () => {
        // fica na aba: quem esta escolhendo costuma clicar em varios seguidos.
        // O Editor esta a uma aba de distancia quando a escolha estiver feita.
        const jaAtivo = APP.eng === eng && eng.layout() === l.key;
        APP.eng = eng;
        if (!jaAtivo) eng.setLayout(l.key);   // reclicar nao reaplica o preset
        invalidate();
        render();
      });
      row.appendChild(b);
    }
    g.appendChild(row);
    body.appendChild(g);
  }
  if (!achou){
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'Nenhum template com “' + APP.busca + '”.';
    body.appendChild(p);
  }
}

/* ---------- aba Editor ---------- */
function card(titulo){
  const d = document.createElement('div');
  d.className = 'ctl';
  if (titulo){
    const h = document.createElement('div');
    h.className = 'crow';
    h.innerHTML = '<span class="clabel">' + titulo + '</span>';
    d.appendChild(h);
  }
  return d;
}
function slider(c, eng, ctl, onSet){
  const row = document.createElement('div');
  row.className = 'crow';
  row.innerHTML = '<span class="clabel">' + ctl.label + '</span>' +
                  '<span class="chip">' + ctl.value + ctl.suffix + '</span>';
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = ctl.min; inp.max = ctl.max; inp.step = 1; inp.value = ctl.value;
  inp.addEventListener('input', e => {
    const v = +e.target.value;
    row.querySelector('.chip').textContent = v + ctl.suffix;
    (onSet || eng.set)(ctl.key, v);
    invalidate();
  });
  c.appendChild(row);
  c.appendChild(inp);
}
function renderEditor(){
  const body = $('body');
  body.innerHTML = '';
  const eng = APP.eng;

  const atual = eng.layouts().find(l => l.key === eng.layout());
  const head = card(null);
  head.innerHTML =
    '<div class="crow" style="margin:0"><span class="clabel">' + (atual ? atual.name : '') + '</span>' +
    '<span class="chip">' + eng.id + '</span></div>';
  body.appendChild(head);

  const forma = card('Forma');
  eng.controls().forEach(ctl => slider(forma, eng, ctl, (k, v) => eng.set(k, v)));
  const dirs = eng.dirs && eng.dirs();
  if (dirs){
    const seg = document.createElement('div');
    seg.className = 'seg';
    dirs.options.forEach(([k, rot]) => {
      const b = document.createElement('button');
      b.textContent = rot + '  ' + k;
      b.setAttribute('aria-pressed', String(dirs.value === k));
      b.addEventListener('click', () => { eng.setDir(k); invalidate(); render(); });
      seg.appendChild(b);
    });
    forma.appendChild(seg);
  }
  body.appendChild(forma);

  if (eng.camera){
    const cam = card('Câmera');
    eng.camera().forEach(ctl => slider(cam, eng, ctl, (k, v) => eng.set(k, v)));
    body.appendChild(cam);
  }

  const mov = card('Movimento');
  if (eng.modes){
    const m = eng.modes();
    const sel = document.createElement('select');
    m.options.forEach(([k, rot]) => {
      const o = document.createElement('option');
      o.value = k; o.textContent = rot; o.selected = k === m.value;
      sel.appendChild(o);
    });
    sel.addEventListener('change', e => { eng.setMode(e.target.value); invalidate(); render(); });
    mov.appendChild(sel);
    mov.appendChild(document.createElement('div')).style.height = '10px';
  }
  if (eng.toggles){
    const seg = document.createElement('div');
    seg.className = 'seg';
    eng.toggles().forEach(t => {
      const b = document.createElement('button');
      b.textContent = t.label;
      b.setAttribute('aria-pressed', String(t.value));
      b.addEventListener('click', () => { eng.toggle(t.key); invalidate(); render(); });
      seg.appendChild(b);
    });
    mov.appendChild(seg);
    mov.appendChild(document.createElement('div')).style.height = '10px';
  }
  eng.motion().forEach(ctl => slider(mov, eng, ctl, (k, v) => eng.set(k, v)));
  body.appendChild(mov);

  const saida = card('Saída');
  const sel = document.createElement('select');
  eng.formats().forEach(f => {
    const o = document.createElement('option');
    o.value = f.key; o.textContent = f.key; o.selected = f.key === String(eng.format());
    sel.appendChild(o);
  });
  sel.addEventListener('change', e => { eng.setFormat(e.target.value); invalidate(); render(); });
  saida.appendChild(sel);
  if (eng.drawGuide){
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.style.marginTop = '10px';
    const b2 = document.createElement('button');
    b2.textContent = 'Guia de enquadramento';
    b2.setAttribute('aria-pressed', String(APP.guia));
    b2.addEventListener('click', () => { APP.guia = !APP.guia; invalidate(); render(); });
    seg.appendChild(b2);
    saida.appendChild(seg);
  }
  const sub = document.createElement('div');
  sub.className = 'csub';
  sub.textContent = 'semente ' + eng.seed();
  saida.appendChild(sub);
  body.appendChild(saida);

  if (eng.video){
    const vid = card('Vídeo');
    eng.video().forEach(ctl => slider(vid, eng, ctl, (k, v) => {
      eng.setVideo(k, v);
      if (k === 'frame') APP.playing = false;      // arrastar o frame pausa
    }));
    body.appendChild(vid);
  }
}

/* ---------- paleta ---------- */
function renderPal(){
  const eng = APP.eng;
  const ps = eng.palettes();
  const atual = ps.find(p => String(p.key) === String(eng.palette())) || ps[0];

  $('palDots').innerHTML =
    '<i style="background:' + atual.ink + '"></i><i style="background:' + atual.bands[2] + '"></i>';

  const sw = $('palSwatches');
  sw.innerHTML = '';
  ps.forEach(p => {
    const b = document.createElement('button');
    b.style.background = p.ink;
    b.title = p.name;
    b.setAttribute('aria-pressed', String(String(p.key) === String(eng.palette())));
    b.addEventListener('click', () => { eng.setPalette(p.key); invalidate(); renderPal(); if (APP.tab === 'assets') renderAssets(); });
    sw.appendChild(b);
  });

  // A rampa mostra os tons da paleta e o ponto marca qual deles e o acento.
  // Clicar troca o acento — e o que faz o ponto significar alguma coisa.
  const ramp = $('palRamp');
  const acento = APP.eng.accent().toLowerCase();
  ramp.innerHTML = '';
  atual.bands.forEach(c => {
    const b = document.createElement('button');
    b.style.background = c;
    b.title = c;
    b.setAttribute('aria-pressed', String(c.toLowerCase() === acento));
    b.addEventListener('click', () => {
      APP.eng.setAccent(c);
      invalidate();
      renderPal();
      if (APP.tab === 'assets') renderAssets();
    });
    ramp.appendChild(b);
  });
}

/* ---------- menu ---------- */
function renderMenu(){
  const m = $('popMenu');
  m.innerHTML = '';
  const item = (rot, extra, fn) => {
    const b = document.createElement('button');
    b.innerHTML = '<span>' + rot + '</span>' + (extra ? '<b>' + extra + '</b>' : '');
    b.addEventListener('click', () => { fn(); m.classList.remove('on'); });
    m.appendChild(b);
  };
  item('Nova semente', APP.eng.seed(), () => { APP.eng.reseed(); invalidate(); render(); });
  item('Exportar PNG', '', () => APP.eng.exportPNG());
  if (APP.eng.exportSVG) item('Exportar SVG', '', () => APP.eng.exportSVG());
  if (APP.eng.hasVideo) item('Exportar WebM', '', () => APP.eng.exportWebM());
  const d = document.createElement('div'); d.className = 'div'; m.appendChild(d);
  item('Copiar link', '', async () => {
    escreverHash();
    setTimeout(async () => {
      try { await navigator.clipboard.writeText(location.href); } catch (e){ /* sem permissao */ }
    }, 350);
  });
  item('Código no GitHub', '', () => window.open('https://github.com/lucasbatistaribeiro/animations', '_blank'));
}

/* ---------- render geral ---------- */
function render(){
  $('tabAssets').setAttribute('aria-selected', String(APP.tab === 'assets'));
  $('tabEditor').setAttribute('aria-selected', String(APP.tab === 'editor'));
  $('searchWrap').style.display = APP.tab === 'assets' ? '' : 'none';
  if (APP.tab === 'assets') renderAssets(); else renderEditor();
  renderPal();
  $('icoPlay').innerHTML = APP.playing
    ? '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

/* ---------- eventos ---------- */
$('tabAssets').addEventListener('click', () => { APP.tab = 'assets'; render(); });
$('tabEditor').addEventListener('click', () => { APP.tab = 'editor'; render(); });
$('search').addEventListener('input', e => { APP.busca = e.target.value; renderAssets(); });
$('btPlay').addEventListener('click', () => { APP.playing = !APP.playing; render(); });
$('btExport').addEventListener('click', () => APP.eng.exportPNG());

function popup(el, ancora){
  const r = ancora.getBoundingClientRect();
  el.classList.toggle('on');
  if (!el.classList.contains('on')) return;
  el.style.left = Math.max(12, Math.min(window.innerWidth - el.offsetWidth - 12, r.left - 20)) + 'px';
  el.style.top = (r.top - el.offsetHeight - 12) + 'px';
}
$('btPal').addEventListener('click', e => { e.stopPropagation(); $('popMenu').classList.remove('on'); renderPal(); popup($('popPal'), $('btPal')); });
$('btMenu').addEventListener('click', e => { e.stopPropagation(); $('popPal').classList.remove('on'); renderMenu(); popup($('popMenu'), $('btMenu')); });
document.addEventListener('click', e => {
  if (!e.target.closest('.pop') && !e.target.closest('.dock')){
    $('popPal').classList.remove('on');
    $('popMenu').classList.remove('on');
  }
});

/* orbita do 3D direto no canvas */
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (!APP.eng.orbit) return;              // capacidade, nao identidade do motor
  drag = { x:e.clientX, y:e.clientY };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  APP.eng.orbit(e.clientX - drag.x, e.clientY - drag.y);
  invalidate();
  drag = { x:e.clientX, y:e.clientY };
});
stage.addEventListener('pointerup', () => { drag = null; });
stage.addEventListener('wheel', e => {
  if (!APP.eng.zoomBy) return;
  e.preventDefault();
  APP.eng.zoomBy(e.deltaY);
  invalidate();
}, { passive:false });

document.addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.code === 'Space'){ e.preventDefault(); APP.playing = !APP.playing; render(); }
  if (e.key.toLowerCase() === 'n'){ APP.eng.reseed(); invalidate(); render(); }
  if (e.key.toLowerCase() === 'e') APP.eng.exportPNG();
});

window.addEventListener('resize', resize);

/* Handle para o test.html, que dirige esta pagina dentro de um iframe.
   Declaracoes com const nao viram propriedade de window, e sem isso o
   harness nao alcanca os motores — e testar uma copia nao testaria nada. */
window.__gerador = { ENGINES, APP, render, invalidate };

resize();
lerHash();
render();
requestAnimationFrame(frame);
</script>
</body>
